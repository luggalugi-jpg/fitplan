# Einmalig ausführen: erzeugt den Upload-Schlüssel für Google Play.
# Danach die Werte als Repository-Secrets eintragen und den Lauf samt Artefakt LÖSCHEN.
name: "1 · Android-Schlüssel erzeugen (einmalig)"
on: workflow_dispatch
jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - name: Schlüssel erzeugen
        run: |
          PASS=$(openssl rand -base64 24 | tr -d '/+=' | cut -c1-24)
          keytool -genkeypair -v -storetype PKCS12 -keystore upload.jks -alias upload \
            -keyalg RSA -keysize 4096 -validity 10000 -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=Luca Preikschas, O=Gainora, C=DE"
          mkdir out && cp upload.jks out/
          base64 -w0 upload.jks > out/ANDROID_KEYSTORE_BASE64.txt
          printf "ANDROID_KEYSTORE_PASSWORD=%s\nANDROID_KEY_ALIAS=upload\nANDROID_KEY_PASSWORD=%s\n" "$PASS" "$PASS" > out/passwoerter.txt
      - uses: actions/upload-artifact@v4
        with: { name: android-upload-schluessel, path: out/, retention-days: 1 }
