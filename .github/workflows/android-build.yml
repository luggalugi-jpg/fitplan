# Baut das signierte App-Bundle (.aab) für Google Play.
# Start: Actions → "2 · Android-App bauen" → Run workflow
name: "2 · Android-App bauen"
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - name: Abhängigkeiten
        run: npm install
      - name: Web-App übernehmen
        run: node scripts/copy-web.mjs
      - name: Android-Projekt anlegen
        run: "[ -d android ] || npx cap add android"
      - name: Icons und Startbild
        run: npx capacitor-assets generate --android --iconBackgroundColor "#1c7a4b" --iconBackgroundColorDark "#0d1310" --splashBackgroundColor "#1c7a4b" --splashBackgroundColorDark "#0d1310"
      - name: Synchronisieren
        run: npx cap sync android
      - name: Ziel-API 36 und Versionsnummer
        run: |
          sed -i -E 's/(compileSdkVersion|targetSdkVersion) = [0-9]+/\1 = 36/' android/variables.gradle
          grep -E "compileSdkVersion|targetSdkVersion|minSdkVersion" android/variables.gradle
          V=$(node -p "require('./package.json').version")
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"$V\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle
      - name: Upload-Schlüssel
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/upload.jks
      - name: App-Bundle bauen
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=$PWD/app/upload.jks \
            -Pandroid.injected.signing.store.password='${{ secrets.ANDROID_KEYSTORE_PASSWORD }}' \
            -Pandroid.injected.signing.key.alias='${{ secrets.ANDROID_KEY_ALIAS }}' \
            -Pandroid.injected.signing.key.password='${{ secrets.ANDROID_KEY_PASSWORD }}'
      - uses: actions/upload-artifact@v4
        with:
          name: fit-wochenplan-android-${{ github.run_number }}
          path: app/android/app/build/outputs/bundle/release/app-release.aab
