# Baut das signierte App-Bundle (.aab) für Google Play.
# Start: Actions → "2 · Android-App bauen" → Run workflow
name: "2 · Android-App bauen"
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - name: Abhängigkeiten
        run: npm install
      - name: Web-App übernehmen
        run: node scripts/copy-web.mjs
      - name: Android-Projekt anlegen
        run: "[ -d android ] || npx cap add android"
      - name: Standort-Berechtigung (Pausenspiele nur im Gym)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q ACCESS_FINE_LOCATION $M || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-feature android:name="android.hardware.location.gps" android:required="false" />\n</manifest>#' $M
          grep -E "LOCATION|location.gps" $M
      - name: Icons und Startbild
        run: npx capacitor-assets generate --android --iconBackgroundColor "#111317" --iconBackgroundColorDark "#111317" --splashBackgroundColor "#111317" --splashBackgroundColorDark "#111317"
      - name: Synchronisieren
        run: npx cap sync android
      - name: Ziel-API 36 und Versionsnummer
        run: |
          sed -i -E 's/(compileSdkVersion|targetSdkVersion) = [0-9]+/\1 = 36/' android/variables.gradle
          grep -E "compileSdkVersion|targetSdkVersion|minSdkVersion" android/variables.gradle
          V=$(node -p "require('./package.json').version")
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"$V\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle
      - name: Upload-Schlüssel prüfen
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          K_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          K_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Häufige Eingabefehler bereinigen: "NAME=" davor, Leerzeichen, Zeilenumbrüche
          sauber() { printf '%s' "$1" | tr -d '\r\n' | sed -E 's/^[[:space:]]*(ANDROID_[A-Z_]+=)?//; s/[[:space:]]+$//'; }
          # Wurde der ganze Inhalt von passwoerter.txt eingefügt, den passenden Wert herausziehen
          wert() { local roh="$1" name="$2"; if printf '%s' "$roh" | grep -q "$name="; then printf '%s' "$roh" | tr '\r' '\n' | grep -o "$name=[^[:space:]]*" | head -1 | cut -d= -f2-; else sauber "$roh"; fi; }
          KS_PASS=$(wert "$KS_PASS" ANDROID_KEYSTORE_PASSWORD); K_ALIAS=$(wert "$K_ALIAS" ANDROID_KEY_ALIAS); K_PASS=$(wert "$K_PASS" ANDROID_KEY_PASSWORD)
          [ -z "$K_ALIAS" ] && K_ALIAS=upload
          FEHLT=""
          [ -z "$KS_B64" ] && FEHLT="$FEHLT ANDROID_KEYSTORE_BASE64"
          [ -z "$KS_PASS" ] && FEHLT="$FEHLT ANDROID_KEYSTORE_PASSWORD"
          if [ -n "$FEHLT" ]; then echo "::error::Diese Secrets fehlen oder sind leer:$FEHLT"; exit 1; fi
          printf '%s' "$KS_B64" | sed -E 's/^ANDROID_KEYSTORE_BASE64=//' | tr -d ' \r\n\t' | base64 -d > android/app/upload.jks 2>/dev/null \
            || { echo "::error::ANDROID_KEYSTORE_BASE64 ist kein gültiger Base64-Text. Bitte den kompletten Inhalt von ANDROID_KEYSTORE_BASE64.txt eintragen."; exit 1; }
          GROESSE=$(stat -c%s android/app/upload.jks)
          echo "Schlüsseldatei: $GROESSE Bytes"
          if [ "$GROESSE" -lt 1500 ]; then echo "::error::ANDROID_KEYSTORE_BASE64 ist unvollständig ($GROESSE Bytes). Bitte den gesamten Text kopieren."; exit 1; fi
          # Passwort finden – auch wenn es versehentlich in einem anderen Feld steht
          OK=""
          for KANDIDAT in "$KS_PASS" "$K_PASS" "$K_ALIAS"; do
            [ -z "$KANDIDAT" ] && continue
            if keytool -list -keystore android/app/upload.jks -storetype PKCS12 -storepass "$KANDIDAT" >/dev/null 2>&1; then OK="$KANDIDAT"; break; fi
          done
          if [ -z "$OK" ]; then
            echo "::error::Keines der eingetragenen Passwörter passt zur Schlüsseldatei (Länge ANDROID_KEYSTORE_PASSWORD: ${#KS_PASS}, ANDROID_KEY_PASSWORD: ${#K_PASS} Zeichen; erwartet 24). Bitte das Passwort aus passwoerter.txt (Teil nach dem =) neu eintragen."; exit 1; fi
          [ "$OK" != "$KS_PASS" ] && echo "::warning::Das richtige Passwort stand in einem anderen Secret – verwende es."
          KS_PASS="$OK"; K_PASS="$OK"
          if ! keytool -list -keystore android/app/upload.jks -storetype PKCS12 -storepass "$KS_PASS" -alias "$K_ALIAS" >/dev/null 2>&1; then
            echo "::warning::ANDROID_KEY_ALIAS stimmt nicht, verwende 'upload'."; K_ALIAS=upload
            keytool -list -keystore android/app/upload.jks -storetype PKCS12 -storepass "$KS_PASS" -alias upload >/dev/null 2>&1 \
              || { echo "::error::Im Schlüssel gibt es keinen Eintrag 'upload'. Wurde die richtige Datei verwendet?"; exit 1; }
          fi
          echo "Schlüssel, Passwort und Alias passen."
          { echo "KS_PASS=$KS_PASS"; echo "K_ALIAS=$K_ALIAS"; echo "K_PASS=$K_PASS"; } > "$RUNNER_TEMP/sign.env"
      - name: App-Bundle bauen
        working-directory: app/android
        run: |
          set -a; . "$RUNNER_TEMP/sign.env"; set +a
          chmod +x gradlew
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=$PWD/app/upload.jks \
            -Pandroid.injected.signing.store.password="$KS_PASS" \
            -Pandroid.injected.signing.key.alias="$K_ALIAS" \
            -Pandroid.injected.signing.key.password="$K_PASS"
          rm -f "$RUNNER_TEMP/sign.env" app/upload.jks
      - uses: actions/upload-artifact@v4
        with:
          name: gainpilot-android-${{ github.run_number }}
          path: app/android/app/build/outputs/bundle/release/app-release.aab
