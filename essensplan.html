<style>
:root{

.hd small{display:block;color:var(--mut);font-size:12px;font-weight:500}
main{padding:12px 14px 4px;max-width:620px;margin:auto}

 display:flex;flex-direction:column;align-items:center;gap:2px;font-family:inherit}
nav button i{font-size:20px;font-style:normal;line-height:1}
nav button.on{color:var(--brand);background:var(--brand-l)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:var(--sh)}
h3{margin:16px 0 8px;font-size:13px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.4px}
h4{margin:0 0 8px;font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.4px}
.sub{display:flex;gap:6px;margin-bottom:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;
 overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.sub::-webkit-scrollbar{display:none}
.sub button{flex:1 0 auto;min-width:max-content;white-space:nowrap;padding:9px 12px;border-radius:10px;border:0;background:none;
 color:var(--mut);font-size:13px;font-weight:600;font-family:inherit}
.sub button.on{background:var(--brand);color:#fff}

.tabs::-webkit-scrollbar{display:none}

.tabs button.on{background:var(--brand);border-color:var(--brand);color:#fff}

 font-size:14px;font-weight:600;margin-top:6px;font-family:inherit}
.pick:active{background:var(--bg)}
.x{border:0;background:transparent;color:var(--danger);padding:8px;font-size:17px;font-family:inherit}

.ok.on{background:var(--brand);color:#fff}

</head>

function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function mondayOf(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());const w=(x.getDay()+6)%7;x.setDate(x.getDate()-w);return x;}
function todayISO(){return iso(new Date());}

 L.push("Standort: "+location.href.replace(/[?#].*$/,""));
 L.push("Speicher: "+(function(){try{return localStorage.getItem("fitplan")?"vorhanden, "+localStorage.getItem("fitplan").length+" Zeichen":"leer"}catch(e){return "nicht lesbar: "+e.message}})());
 L.push("API-Schlüssel: "+(S.key?"eingetragen, "+S.key.length+" Zeichen, beginnt mit "+S.key.slice(0,4):"FEHLT"));
 L.push("Modell gespeichert: "+(S.fast||S.model||"(leer)"));

 L.push("Plan: "+Object.keys(S.plan||{}).length+" Felder, "+entries(0).length+"/"+entries(3).length+" Einträge (Tag 0/3) | Protokolltage: "+Object.keys(S.log||{}).length);
 L.push("Letzter Fehler: "+(LASTERR||"keiner"));
 L.push("");

function logDownload(){

 try{

  a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),2000);
  logInfo("log","Protokolldatei erstellt: "+name);
 }catch(e){logErr("log","Download fehlgeschlagen: "+e.message);}

}

async function askText(model,prompt,tokens){

   {method:"POST",signal:ctl.signal,headers:{"Content-Type":"application/json","x-goog-api-key":S.key},

 }catch(e){logErr("api","Textaufruf Ausnahme: "+e.message,{modell:model,name:e.name});return {ok:false,error:(e.name||"Fehler")+": "+e.message};}
 finally{clearTimeout(to);}
}
const modelsTriedBad=new Set();

  try{const r=await fetch(url,{method:"POST",signal:ctl.signal,headers:{"Content-Type":"application/json","x-goog-api-key":S.key},body:JSON.stringify(body)});
   return {r,j:await r.json()};}
  catch(e){return {r:{ok:false,status:0},j:{error:{message:e.name=="AbortError"?"Zeitlimit nach "+(Math.round((ms||IMG_TIMEOUT)/1000))+" s":e.message}}};}

 (LIST||[]).slice(0,4).forEach(m=>{if(!order.includes(m))order.push(m)});

function vorschlagMoeglich(){
 const m=MEALS.concat(S.custom||[]);

function zufall(n){return Math.floor(Math.random()*n);}
function mische(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=zufall(i+1);const t=b[i];b[i]=b[j];b[j]=t;}return b;}
// Auswahl: Eiweißdichte, Kaloriennähe, Abwechslung, Zufall
function mahlzeitScore(m,rest,zaehler,streng){
 if(!rest)return 0;
 const dichte=m.p/Math.max(1,m.k)*100;
 const naehe=1-Math.min(1,Math.abs(m.k-rest)/(rest||1));
 const oft=zaehler[m.id]||0;
 const abwechslung=streng?Math.max(0,2-oft)*1.2:Math.max(0,1-oft)*0.5;
 const zufallswert=Math.random()*(streng?0.8:1.6);
 return dichte*1.5+naehe*2+abwechslung+zufallswert;
}
function vorschlagWoche(streng){
 const ziel=Math.max(1200,S.kcal||2000);
 const alle=MEALS.concat(S.custom||[]).filter(m=>m&&m.k>0&&m.i&&m.i.length);
 if(alle.length<8){alert("Zu wenige Gerichte verfügbar. Lege eigene Gerichte an oder ergänze die Liste.");return;}
 const slots=[["f",0.25],["m",0.35],["a",0.30],["s",0.10]];
 const zaehler={},gewaehlt={};
 for(let d=0;d<7;d++){
  const tag={};
  slots.forEach(([sl,anteil])=>{
   const pool=alle.filter(m=>(m.c||"m")==sl);
   if(!pool.length)return;
   const rest=ziel*anteil;
   const bewertet=mische(pool).map(m=>({m,p:mahlzeitScore(m,rest,zaehler,streng)}));
   bewertet.sort((a,b)=>b.p-a.p);
   // aus den besten fünf zufällig wählen, damit nicht immer dasselbe kommt
   const top=bewertet.slice(0,Math.min(5,bewertet.length));
   const wahl=top[zufall(top.length)].m;
   zaehler[wahl.id]=(zaehler[wahl.id]||0)+1;
   tag[sl]=wahl;
  });
  gewaehlt[d]=tag;
 }
 // Portionen auf das Tagesziel abstimmen
 for(let d=0;d<7;d++){
  const tag=gewaehlt[d],ids=slots.map(([sl])=>tag[sl]).filter(Boolean);
  let q=1;
  for(let r=0;r<8;r++){
   let k=0;ids.forEach(m=>{k+=m.k*q;});
   if(Math.abs(k-ziel)<50||k<=0)break;
   q=Math.max(0.5,Math.min(3,Math.round(q*(ziel/k)*2)/2));
  }
  gewaehlt[d]={tag,ids,q};
 }
 return {gewaehlt};
}

  kSum+=k;pSum+=p;
  txt+="▪ "+DAYS[d]+": "+ids.map(m=>m.n+" ("+q+"×)").join(", ")+"\n   "+Math.round(k)+" kcal · "+Math.round(p)+" g Eiweiß\n";

function wChart(){
 const w=S.weight||{},ks=Object.keys(w).sort();
 if(ks.length<2)return `<div class="card"><h4>Verlauf</h4><div class="empty">Ab zwei Messungen erscheint hier die Kurve.</div></div>`;
 const pts=ks.slice(-30).map(k=>({d:k,v:+w[k]}));
 const W=320,H=150,PL=38,PR=10,PT=12,PB=24;
 const vals=pts.map(p=>p.v);
 let lo=Math.min(...vals),hi=Math.max(...vals);
 if(S.wGoal){lo=Math.min(lo,S.wGoal);hi=Math.max(hi,S.wGoal)}
 const pad=Math.max(0.4,(hi-lo)*0.12);lo-=pad;hi+=pad;
 const x=i=>PL+(W-PL-PR)*(pts.length<2?0:i/(pts.length-1));
 const y=v=>PT+(H-PT-PB)*(1-(v-lo)/(hi-lo));
 const line=pts.map((p,i)=>`${i?"L":"M"}${x(i).toFixed(1)} ${y(p.v).toFixed(1)}`).join(" ");
 const flaeche=`${line} L${x(pts.length-1).toFixed(1)} ${H-PB} L${x(0).toFixed(1)} ${H-PB} Z`;
 const grid=[0,0.5,1].map(f=>{const v=lo+(hi-lo)*f;return `<line x1="${PL}" y1="${y(v).toFixed(1)}" x2="${W-PR}" y2="${y(v).toFixed(1)}" stroke="var(--line)" stroke-width="1"/>
 <text x="${PL-5}" y="${(y(v)+3.5).toFixed(1)}" font-size="9" fill="var(--mut)" text-anchor="end">${v.toFixed(1)}</text>`;}).join("");
 const ziel=S.wGoal?`<line x1="${PL}" y1="${y(S.wGoal).toFixed(1)}" x2="${W-PR}" y2="${y(S.wGoal).toFixed(1)}" stroke="var(--brand)" stroke-width="1.2" stroke-dasharray="4 3"/>
 <text x="${W-PR}" y="${(y(S.wGoal)-4).toFixed(1)}" font-size="9" fill="var(--brand)" text-anchor="end">Ziel ${S.wGoal}</text>`:"";
 const gridx=pts.map((p,i)=>{const step=Math.max(1,Math.ceil(pts.length/4));
  return i%step===0||i==pts.length-1?`<text x="${x(i).toFixed(1)}" y="${H-8}" font-size="9" fill="var(--mut)" text-anchor="middle">${p.d.slice(8,10)}.${p.d.slice(5,7)}.</text>`:"";}).join("");
 const dots=pts.map((p,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="2.4" fill="var(--brand)"/>`).join("");
 return `<div class="card"><h4>Gewichtskurve</h4>
 <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img" aria-label="Gewichtsverlauf">
  ${grid}${ziel}
  <path d="${flaeche}" fill="var(--brand)" opacity="0.10"/>
  <path d="${line}" fill="none" stroke="var(--brand)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  ${dots}${gridx}
 </svg>
 <small style="color:var(--mut)">${pts.length} Messungen${pts.length>1?` · ${(pts[pts.length-1].v-pts[0].v>=0?"+":"")+(pts[pts.length-1].v-pts[0].v).toFixed(1)} kg im Zeitraum`:""}</small></div>`;
}

function zielFortschritt(){
 const start=S.wStart,ziel=S.wGoal,dEnde=S.wGoalDate;
 const w=S.weight||{},ks=Object.keys(w).sort();
 const jetzt=ks.length?+w[ks[ks.length-1]]:null;
 if(!ziel||!jetzt)return `<small style="color:var(--mut)">Trage aktuelles Gewicht und Zielgewicht ein, dann rechne ich den Zeitplan aus.</small>`;
 const diff=jetzt-ziel;
 const richtung=diff>0?"abnehmen":(diff<0?"zunehmen":"halten");
 let h=`<div class="row"><span>Noch zu ${richtung}</span><span>${Math.abs(diff).toFixed(1)} kg</span></div>`;
 if(!dEnde||!start){
  h+=`<small style="color:var(--mut)">Setze ein Zieldatum, dann rechne ich aus, wie viel pro Woche nötig ist.</small>`;
  return h;
 }
 const heute=new Date(todayISO()),ende=new Date(dEnde);
 const tage=Math.round((ende-heute)/86400000);
 if(tage<=0){h+=`<small style="color:#b45309">Das Zieldatum liegt in der Vergangenheit. Wähle ein neues Datum.</small>`;return h;}
 const wochen=Math.max(tage/7,0.1);
 const proWoche=Math.abs(diff)/wochen;
 const gesamt=Math.abs(start-ziel);
 const geschafft=Math.abs(start-jetzt);
 const anteil=gesamt>0?Math.min(100,Math.max(0,Math.round(geschafft/gesamt*100))):100;
 // bisheriges Tempo
 let tempo=null;
 if(ks.length>=2){
  const erst=ks[0],letzt=ks[ks.length-1];
  const t2=Math.max(1,Math.round((new Date(letzt)-new Date(erst))/86400000));
  tempo=(+w[letzt]-+w[erst])/(t2/7);
 }
 const tempoProWoche=tempo!==null?Math.abs(tempo):null;
 const noetigProWoche=proWoche;
 let bewertung="";
 if(tempoProWoche!==null&&noetigProWoche>0.05){
  const faktor=tempoProWoche/noetigProWoche;
  const richtigeRichtung=(diff>0&&tempo<0)||(diff<0&&tempo>0)||Math.abs(diff)<0.3;
  if(!richtigeRichtung)bewertung="Dein Gewicht bewegt sich derzeit in die andere Richtung.";
  else if(faktor>=1.15)bewertung="Du bist schneller unterwegs als nötig.";
  else if(faktor>=0.85)bewertung="Du bist gut im Plan.";
  else bewertung="Du bist etwas langsamer als nötig.";
 }
 h+=`<div class="row"><span>Bis zum Datum</span><span>${tage} Tage (${wochen.toFixed(1)} Wochen)</span></div>
 <div class="row"><span>Nötig pro Woche</span><span>${noetigProWoche.toFixed(2)} kg</span></div>`;
 if(tempoProWoche!==null)h+=`<div class="row"><span>Dein Tempo bisher</span><span>${richtungsWort(tempo)}${tempoProWoche.toFixed(2)} kg/Woche</span></div>`;
 h+=`<div class="row"><span>Fortschritt</span><span>${anteil} %</span></div>${bar("",anteil,100,"")}`;
 if(bewertung)h+=`<small style="color:var(--mut)">${bewertung}</small>`;
 h+=`<small style="display:block;color:var(--mut);margin-top:6px">Ein Tempo von etwa 0,25 bis 0,75 kg pro Woche gilt als gut verträglich. Deutlich mehr ist meist nicht dauerhaft.</small>`;
 return h;
}
function richtungsWort(t){return t>0?"+":(t<0?"−":"");}
function bedarf(){
 const w=S.weight||{},ks=Object.keys(w).sort();
 const kg=ks.length?+w[ks[ks.length-1]]:null;
 if(!kg||!S.height||!S.age)return null;
 const s1=(S.sex=="f")?-161:5;
 const bmr=Math.round(10*kg+6.25*(+S.height)-5*(+S.age)+s1);
 const tdee=Math.round(bmr*(+S.act||1.375));
 let ziel=(S.goal=="cut")?tdee-400:(S.goal=="bulk"?tdee+250:tdee);
 const prot=Math.round(kg*(S.goal=="cut"?2.0:1.8));
 return {bmr,tdee,ziel,prot,hinweis:"Berechnet mit der Mifflin-St.-Jeor-Formel und dem Aktivitätsfaktor. Das ist eine Schätzung, kein medizinischer Rat."};
}

 const isoD=dISO(S.wk,S.day);
 let h=`<div class="wkpick"><button class="nav" onclick="wkShift(-1)">‹</button><span>${fmtDay(S.wk,S.day)}</span><button class="nav" onclick="wkShift(1)">›</button></div>`;
 const plan=suppPlan(isoD),lst=suppOf(isoD);
 const gen=lst.filter(x=>x.taken).length;
 h+=`<div class="card"><div class="row"><b>Heute genommen</b><span>${plan.length?gen+" von "+plan.length:"nichts geplant"}</span></div>
 ${plan.length?bar("",gen,plan.length,""):""}
 <small style="display:block;color:var(--mut)">Tippe auf ein Präparat, sobald du es genommen hast. Den Plan änderst du im Reiter Planen unter Supplements.</small></div>`;
 if(!plan.length)h+=`<div class="card"><div class="empty">Für diesen Tag ist nichts geplant. Lege es im Reiter Planen unter Supplements an.</div></div>`;
 lst.forEach(x=>{const ref=sdKey(isoD,x.n);
  h+=`<div class="card"><div class="meal"><div style="flex:1"><b>${esc(x.n)}</b>
  ${x.x&&(x.x.e||x.x.w)?`<small>${x.x.e?esc(x.x.e):""}${x.x.e&&x.x.w?" · ":""}${x.x.w?esc(x.x.w):""}</small>`:""}
  ${x.x&&x.x.z?`<small>${esc(x.x.z)}</small>`:""}</div>
  <button class="ok ${x.taken?'on':''}" onclick="suppTick('${isoD}','${esc(x.n)}')">${x.taken?"✓ genommen":"nehmen"}</button></div></div>`;});
 let hk="",genW=0;
 for(let i=0;i<7;i++){const d=dISO(S.wk,i),p=suppPlan(d),g=p.filter(n=>S.suppDone[sdKey(d,n)]).length;
  if(g)genW+=g;
  hk+=`<div class="row"><span>${fmtDay(S.wk,i)}</span><span>${p.length?g+" / "+p.length:"–"}</span></div>`;}
 h+=`<div class="card"><h4>Diese Woche</h4>${hk}<hr><div class="row"><b>Einnahmen</b><span>${genW}</span></div></div>`;
 const tage=[...new Set(Object.keys(S.suppDone||{}).filter(k=>S.suppDone[k]).map(k=>k.split("|")[0]))].sort().reverse().slice(0,7);
 if(tage.length)h+=`<div class="card"><h4>Letzte Einnahmen</h4>${tage.map(d=>{
  const namen=suppPlan(d).filter(n=>S.suppDone[sdKey(d,n)]);
  return `<div class="row"><span>${d}</span><span>${namen.length?namen.map(esc).join(", "):"–"}</span></div>`;}).join("")}</div>`;
 return h;
}
function suppSearch(){
 const q=($("#sq")&&$("#sq").value||"").toLowerCase().trim();
 if(!q){$("#sres").innerHTML="";return;}
 const r=allSupps().filter(x=>x.n.toLowerCase().includes(q)).slice(0,6);
 $("#sres").innerHTML=r.map(x=>`<div class="opt" onclick="suppAdd('${esc(x.n)}')"><b>${esc(x.n)}</b><small>${x.e?esc(x.e):""}${x.w?" · "+esc(x.w):""}</small></div>`).join("")||"<small>Nichts gefunden.</small>";
}
function suppAdd(n){const d=dISO(S.wk,S.day);S.supp[d]=S.supp[d]||[];if(!S.supp[d].includes(n))S.supp[d].push(n);
 logInfo("supplement","Präparat aufgenommen",{tag:d,name:n});save();render();}
function suppRemove(d,n){S.supp[d]=(S.supp[d]||[]).filter(x=>x!==n);delete S.suppDone[sdKey(d,n)];save();render();}
function suppTick(d,n){const k=sdKey(d,n);const war=S.suppDone[k];if(war)delete S.suppDone[k];else S.suppDone[k]=1;
 logInfo("supplement",war?"Einnahme zurückgenommen":"Einnahme abgehakt",{datum:d,name:n});save();render();}
function suppWeek(von,an){
 if(!an){if(!confirm("Alle Präparate dieser Woche entfernen?"))return;
  for(let i=0;i<7;i++){const d=dISO(S.wk,i);delete S.supp[d];
   Object.keys(S.suppDone).forEach(k=>{if(k.startsWith(d+"|"))delete S.suppDone[k]});}
  save();logInfo("supplement","Woche geleert",{woche:S.wk});render();return;}
 if(!confirm("Präparate dieses Tages auf alle Tage der Woche setzen?"))return;
 const q=suppPlan(von).slice();
 for(let i=0;i<7;i++)S.supp[dISO(S.wk,i)]=q.slice();
 save();logInfo("supplement","Tag auf Woche kopiert",{tag:von});render();
}
function suppNewForm(){
 sheet(`<h4>Eigenes Präparat</h4><label>Name</label><input class="n" id="sn">
 <label>Menge (z. B. 375 mg)</label><input class="n" id="se">
 <label>Einnahmezeitpunkt</label><input class="n" id="sw" placeholder="z. B. abends">
 <label>Wofür</label><input class="n" id="sz" placeholder="z. B. Muskeln, Schlaf">
 <button class="btn" onclick="suppNewSave()">Speichern</button><button class="btn g" onclick="closeSheet()">Abbrechen</button>`);
}
function suppNewSave(){const n=$("#sn").value.trim();if(!n){alert("Bitte einen Namen eingeben.");return;}
 S.suppLib=S.suppLib||[];S.suppLib.push({n,e:$("#se").value.trim(),w:$("#sw").value.trim(),z:$("#sz").value.trim()});
 save();logInfo("supplement","eigenes Präparat angelegt",{name:n});closeSheet();render();}
/* ---------- ZIELE ---------- */
function viewGoal(){
 let h=`<div class="card"><h4>Tagesziele</h4>
 <button class="btn" onclick="preset(1900,150)">Abnehmen</button><button class="btn g" onclick="preset(2800,170)">Muskelaufbau</button>
 <label>Kalorien (kcal)</label><input class="n" type="number" value="${S.kcal}" onchange="S.kcal=+this.value;save()">
 <label>Eiweiß (g)</label><input class="n" type="number" value="${S.prot}" onchange="S.prot=+this.value;save()">
 <label>Kohlenhydrate (g, optional)</label><input class="n" type="number" value="${S.kh||""}" onchange="S.kh=+this.value||null;save()">
 <label>Fett (g, optional)</label><input class="n" type="number" value="${S.fett||""}" onchange="S.fett=+this.value||null;save()">
 <button class="btn g" onclick="uebernehmeAusTag()">Nährwerte des Tages übernehmen</button>
 <button class="btn g" onclick="uebernehmeAusWoche()">Wochenschnitt übernehmen</button>
 <small>Die Vorlagen sind grobe Richtwerte. Faustregel: 1,6 bis 2,2 g Eiweiß pro kg Körpergewicht; zum Abnehmen etwa 300 bis 500 kcal unter dem Bedarf, für Muskelaufbau etwa 200 bis 300 kcal darüber. Alle Einstellungen dazu findest du im Reiter Mehr.</small></div>
 <div class="card"><h4>Wochenkarte</h4><small style="display:block;color:var(--mut);margin-bottom:8px">Alle Wochen mit Einträgen. Antippen öffnet die Woche.</small>
 ${(()=>{const wo={};Object.keys(S.plan||{}).forEach(k=>{const w=k.split("|")[0];wo[w]=(wo[w]||0)+1});
  Object.keys(S.log||{}).forEach(d=>{const w=weekKey(new Date(d));wo[w]=(wo[w]||0)+1});
  const ks=Object.keys(wo).sort().reverse();
  if(!ks.length)return "<div class='empty'>Noch keine Wochen angelegt.</div>";
  return ks.slice(0,14).map(w=>`<div class="row"><span>${fmtWeek(w)}${w==weekOf(0)?" (aktuell)":""}</span><span><button class="btn g" style="padding:6px 12px;margin:0" onclick="openWeek('${w}')">öffnen</button></span></div>`).join("");})()}
 </div>`;
 return h;
}
function openWeek(w){S.wk=w;S.weekView=w;S.day=0;S.wkLock=true;save();tab="plan";sub.plan="plan";render();}
function preset(k,p){S.kcal=k;S.prot=p;save();render();}
/* ---------- GEGESSEN ---------- */
function viewEat(){
 const isoD=dISO(S.wk,S.day),t=eaten(isoD),log=S.log[isoD]||[];
 let h=weekBar(false,fmtWeek(S.wk));
 h+=`<div class="card"><div class="row"><b>${fmtDay(S.wk,S.day)}</b><span>${isoD==todayISO()?"heute":""}</span></div>
 ${bar("Kalorien",t.k,S.kcal,"kcal")}${bar("Eiweiß",t.p,S.prot,"g")}
 <div class="row"><span>Kohlenhydrate</span><span>${Math.round(t.h)} g</span></div>
 <div class="row"><span>Fett</span><span>${Math.round(t.f)} g</span></div></div>`;
 const pl=entries(S.wk,S.day);
 h+=`<div class="card"><h4>Geplant – antippen zum Abhaken</h4>`;
 if(!pl.length)h+=`<div class="empty">Für diesen Tag ist nichts geplant. Stelle im Reiter Planen etwas zusammen.</div>`;
 pl.forEach(({s,i,e,m})=>{const ref=s+i+":"+e.id+":"+e.q,on=log.some(x=>x.ref==ref);
  h+=`<div class="meal"><div><b>${esc(m.n)}</b><small>${e.q}× · ${mac(m,e.q)}</small><button class="ok" style="margin-top:6px" onclick="showRecipe(${m.id})">Rezept</button></div>
  <button class="ok ${on?'on':''}" onclick="tickPlan('${s}',${i})">${on?'✓ gegessen':'gegessen'}</button></div>`;});
 h+=`</div><div class="card"><h4>Protokoll dieses Tages</h4>`;
 if(!log.length)h+=`<div class="empty">Noch nichts eingetragen.</div>`;
 log.forEach((e,i)=>{h+=`<div class="meal"><div><b>${esc(e.n)}</b>${e.ref?'':'<span class="tag">außerplanmäßig</span>'}<small>${mac(e)}</small></div><button class="x" onclick="delLog(${i})">✕</button></div>`;});
 h+=`</div><div class="card"><h4>Schnell erfassen</h4>
 <button class="btn b" onclick="photoStart()">📷 Foto analysieren</button>
 <button class="btn t" onclick="builder([],'','')">🔎 Datenbank</button>
 <button class="btn g" onclick="eatPick()">+ Gericht aus Liste</button>
 <button class="btn g" onclick="freeForm()">+ Etwas anderes</button></div>`;
 return h;
}
function tickPlan(s,i){
 const isoD=dISO(S.wk,S.day),key=pk(S.wk,S.day),e=(S.plan[key+s]||[])[i];
 if(!e)return;
 const m=meal(e.id),ref=key+s+i+":"+e.id+":"+e.q;
 S.log[isoD]=S.log[isoD]||[];const ix=S.log[isoD].findIndex(x=>x.ref==ref);
 if(ix>=0)S.log[isoD].splice(ix,1);
 else S.log[isoD].push({ref,n:m.n,k:m.k*e.q,p:m.p*e.q,h:m.h*e.q,f:m.f*e.q});
 save();logInfo("protokoll",ix>=0?"geplantes Gericht entfernt":"geplantes Gericht abgehakt",{tag:ref});
 render();
}
function delLog(i){const d=dISO(S.wk,S.day);S.log[d].splice(i,1);save();render();}
function eatPick(){sheet(`<h4>Gericht wählen</h4>${allMeals().map(m=>`<div class="opt" onclick="eatMeal(${m.id})"><b>${esc(m.n)}</b><small>${mac(m)}</small></div>`).join("")}`);}
function eatMeal(id){const m=meal(id);
 sheet(`<h4>${esc(m.n)}</h4><label>Portionen</label><input class="n" id="eq" type="number" step="0.5" value="1" inputmode="decimal">
 <button class="btn" onclick="logMeal(${id})">Eintragen</button><button class="btn g" onclick="closeSheet()">Abbrechen</button>`);}
function logMeal(id){const m=meal(id),q=parseFloat($("#eq").value.replace(",","."))||1;
 const dch=dISO(S.wk,S.day);(S.log[dch]=S.log[dch]||[]).push({n:m.n+(q!=1?` (${q}×)`:""),k:m.k*q,p:m.p*q,h:m.h*q,f:m.f*q});save();closeSheet();render();}
function freeForm(){
 sheet(`<h4>Etwas anderes gegessen</h4><label>Was?</label><input class="n" id="gn" placeholder="z. B. Pizza, Eis, Döner">
 <div class="g2"><input class="n" id="gk" type="number" inputmode="decimal" placeholder="kcal"><input class="n" id="gp" type="number" inputmode="decimal" placeholder="Eiweiß (g)">
 <input class="n" id="gh" type="number" inputmode="decimal" placeholder="Kohlenhydrate (g)"><input class="n" id="gf" type="number" inputmode="decimal" placeholder="Fett (g)"></div>
 <small>Werte sind optional, aber nur eingetragene Werte zählen. Schätzung reicht.</small><br>
 <button class="btn" onclick="logFree()">Eintragen</button><button class="btn g" onclick="closeSheet()">Abbrechen</button>`);}
function logFree(){const n=$("#gn").value.trim();if(!n){alert("Bitte eingeben, was du gegessen hast.");return;}
 const v=x=>parseFloat($(x).value.replace(",","."))||0;
 const dch=dISO(S.wk,S.day);(S.log[dch]=S.log[dch]||[]).push({n,k:v("#gk"),p:v("#gp"),h:v("#gh"),f:v("#gf")});save();closeSheet();render();}
function viewWeek(){
 const wk=S.weekView||S.wk;
 let h=`<div class="wkpick"><button class="nav" onclick="weekShift(-1)">‹</button><span>${fmtWeek(wk)}</span><button class="nav" onclick="weekShift(1)">›</button></div>`;
 h+=`<div class="card"><h4>Plan und tatsächlich</h4>`;
 let sk=0,sp=0,n=0,eingeplant=0;
 for(let i=0;i<7;i++){
  const p=totals(wk,i),e=eaten(dISO(wk,i)),erfasst=(S.log[dISO(wk,i)]||[]).length;eingeplant+=p.k;
  if(erfasst){n++;sk+=e.k;sp+=e.p;}
  h+=`<div style="margin-bottom:16px"><div class="row"><b>${fmtDay(wk,i)}</b><span class="badge" style="${erfasst?"":"background:var(--bg);color:var(--mut)"}">${erfasst?"erfasst":"offen"}</span></div>
  <div class="row"><span>Geplant</span><span>${p.k?Math.round(p.k)+" kcal · "+Math.round(p.p)+" g Eiweiß":"–"}</span></div>
  <div class="row"><span>Gegessen</span><span>${(e.k||e.p)?Math.round(e.k)+" kcal · "+Math.round(e.p)+" g Eiweiß":"–"}</span></div>
  <div class="row"><span>Ziel</span><span>${S.kcal} kcal · ${S.prot} g Eiweiß</span></div>
  ${bar("",e.k||0,S.kcal,"")}</div>`;}
 if(n)h+=`<hr><div class="row"><b>Ø an ${n} Tag(en)</b><span>${Math.round(sk/n)} kcal · ${Math.round(sp/n)} g Eiweiß</span></div>`;
 h+=`</div><div class="card"><h4>Wochenbilanz</h4>
 <div class="row"><span>Gegessen</span><span>${Math.round(sk)} kcal</span></div>
 <div class="row"><span>Ziel für 7 Tage</span><span>${S.kcal*7} kcal</span></div>
 <div class="row"><span>Differenz</span><span>${Math.round(sk-S.kcal*7)} kcal</span></div>
 <div class="row"><span>Eingeplant</span><span>${Math.round(eingeplant)} kcal</span></div></div>`;
 const alt=calorieDays().filter(d=>d<dISO(wk,0)).slice(-14).reverse();
 if(alt.length){h+=`<div class="card"><h4>Frühere Tage</h4>`;
  alt.forEach(d=>{const e=eaten(d);h+=`<div class="row"><span>${d}</span><span>${Math.round(e.k)} kcal · ${Math.round(e.p)} g Eiweiß</span></div>`;});
  h+=`</div>`;}
 return h;
}
function weekShift(n){const dd=dateOf(S.weekView||S.wk,0);dd.setDate(dd.getDate()+n*7);S.weekView=iso(dd);save();render();}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
render();
</script>
</body>
</html>
