 const W=320,H=150,PL=38,PR=10,PT=12,PB=24;
 const vals=pts.map(p=>p.v).concat(pts.map(p=>p.a));
 let lo=Math.min(...vals),hi=Math.max(...vals);
 if(S.wGoal){lo=Math.min(lo,S.wGoal);hi=Math.max(hi,S.wGoal)}
 const pad=Math.max(0.4,(hi-lo)*0.12);lo-=pad;hi+=pad;
 const x=i=>PL+(W-PL-PR)*(pts.length<2?0:i/(pts.length-1));
 const y=v=>PT+(H-PT-PB)*(1-(v-lo)/(hi-lo));
 const roh=pts.map((p,i)=>`${i?"L":"M"}${x(i).toFixed(1)} ${y(p.v).toFixed(1)}`).join(" ");
 const avg=pts.map((p,i)=>`${i?"L":"M"}${x(i).toFixed(1)} ${y(p.a).toFixed(1)}`).join(" ");
 const grid=[0,0.5,1].map(f=>{const v=lo+(hi-lo)*f;return `<line x1="${PL}" y1="${y(v).toFixed(1)}" x2="${W-PR}" y2="${y(v).toFixed(1)}" stroke="var(--line)" stroke-width="1"/>
 <text x="${PL-5}" y="${(y(v)+3.5).toFixed(1)}" font-size="9" fill="var(--mut)" text-anchor="end">${v.toFixed(1)}</text>`;}).join("");
 const ziel=S.wGoal?`<line x1="${PL}" y1="${y(S.wGoal).toFixed(1)}" x2="${W-PR}" y2="${y(S.wGoal).toFixed(1)}" stroke="var(--brand)" stroke-width="1.2" stroke-dasharray="4 3"/>

}

function zielFortschritt(){
 const start=S.wStart,ziel=S.wGoal,dEnde=S.wGoalDate;
 const w=S.weight||{},ks=Object.keys(w).sort();
 const jetzt=ks.length?+w[ks[ks.length-1]]:null;
 if(!ziel||!jetzt)return `<small style="color:var(--mut)">Trage aktuelles Gewicht und Zielgewicht ein, dann rechne ich den Zeitplan aus.</small>`;
 const diff=jetzt-ziel;
 const richtung=diff>0?"abnehmen":(diff<0?"zunehmen":"halten");
 let h=`<div class="row"><span>Noch zu ${richtung}</span><span>${Math.abs(diff).toFixed(1)} kg</span></div>`;
 if(!dEnde||!start){
  h+=`<small style="color:var(--mut)">Setze ein Zieldatum, dann rechne ich aus, wie viel pro Woche nötig ist.</small>`;
  return h;
 }
 const heute=new Date(todayISO()),ende=new Date(dEnde);
 const tage=Math.round((ende-heute)/86400000);
 if(tage<=0){h+=`<small style="color:var(--warn-t)">Das Zieldatum liegt in der Vergangenheit. Wähle ein neues Datum.</small>`;return h;}
 const wochen=Math.max(tage/7,0.1);
 const proWoche=Math.abs(diff)/wochen;
 const gesamt=Math.abs(start-ziel);
 const geschafft=Math.abs(start-jetzt);
 const anteil=gesamt>0?Math.min(100,Math.max(0,Math.round(geschafft/gesamt*100))):100;
 // bisheriges Tempo
 let tempo=null;
 if(ks.length>=2){
  const erst=ks[0],letzt=ks[ks.length-1];
  const t2=Math.max(1,Math.round((new Date(letzt)-new Date(erst))/86400000));
  tempo=(+w[letzt]-+w[erst])/(t2/7);
 }
 const tempoProWoche=tempo!==null?Math.abs(tempo):null;
 const noetigProWoche=proWoche;
 let bewertung="";
 if(tempoProWoche!==null&&noetigProWoche>0.05){
  const faktor=tempoProWoche/noetigProWoche;
  const richtigeRichtung=(diff>0&&tempo<0)||(diff<0&&tempo>0)||Math.abs(diff)<0.3;
  if(!richtigeRichtung)bewertung="Dein Gewicht bewegt sich derzeit in die andere Richtung.";
  else if(faktor>=1.15)bewertung="Du bist schneller unterwegs als nötig.";
  else if(faktor>=0.85)bewertung="Du bist gut im Plan.";
  else bewertung="Du bist etwas langsamer als nötig.";
 }
 h+=`<div class="row"><span>Bis zum Datum</span><span>${tage} Tage (${wochen.toFixed(1)} Wochen)</span></div>
 <div class="row"><span>Nötig pro Woche</span><span>${noetigProWoche.toFixed(2)} kg</span></div>`;
 if(tempoProWoche!==null)h+=`<div class="row"><span>Dein Tempo bisher</span><span>${richtungsWort(tempo)}${tempoProWoche.toFixed(2)} kg/Woche</span></div>`;
 h+=`<div class="row"><span>Fortschritt</span><span>${anteil} %</span></div>${bar("",anteil,100,"")}`;
 if(bewertung)h+=`<small style="color:var(--mut)">${bewertung}</small>`;
 h+=`<small style="display:block;color:var(--mut);margin-top:6px">Ein Tempo von etwa 0,25 bis 0,75 kg pro Woche gilt als gut verträglich. Deutlich mehr ist meist nicht dauerhaft.</small>`;
 return h;
}
function richtungsWort(t){return t>0?"+":(t<0?"−":"");}
function bedarf(){
 const w=S.weight||{},ks=Object.keys(w).sort();
 const kg=ks.length?+w[ks[ks.length-1]]:null;
 if(!kg||!S.height||!S.age)return null;
 const s1=(S.sex=="f")?-161:5;
 const bmr=Math.round(10*kg+6.25*(+S.height)-5*(+S.age)+s1);
 const tdee=Math.round(bmr*(+S.act||1.375));
 let ziel=(S.goal=="cut")?tdee-400:(S.goal=="bulk"?tdee+250:tdee);
 const prot=Math.round(kg*(S.goal=="cut"?2.0:1.8));
 return {bmr,tdee,ziel,prot,hinweis:"Berechnet mit der Mifflin-St.-Jeor-Formel und dem Aktivitätsfaktor. Das ist eine Schätzung, kein medizinischer Rat."};
}

 const sw=(g,t,sub)=>`<div class="sw"><b>${t}</b><button class="swb ${r[g].on?"on":""}" role="switch" aria-checked="${r[g].on?"true":"false"}" aria-label="${t} ${r[g].on?"ausschalten":"einschalten"}" onclick="remSet('${g}','on',${!r[g].on})"></button></div><small style="display:block;color:var(--mut);margin:0 0 ${r[g].on?10:0}px">${sub}</small>`;
 const zeit=(g,k,l,pflicht)=>`<div><label>${l}</label><input class="n" type="time" value="${esc(r[g][k]||"")}" onchange="remZeit('${g}','${k}',this.value,${pflicht?1:0})"></div>`;
 const kt=trDays(),lt=remLauftage(),tage=[0,1,2,3,4,5,6].filter(i=>kt.includes(i)||lt.includes(i)).map(i=>WOCHENTAGE[i]).join(", ");
 const wasserN=n.filter(x=>x.id>=200&&x.id<300).length;
 const st=REM_ST=="verboten"||(!NATIV&&"Notification" in window&&Notification.permission=="denied"&&n.length)?`<div class="card" style="border-color:var(--warn)"><b>Benachrichtigungen sind nicht erlaubt</b><small style="display:block;color:var(--mut);margin-top:4px">Erlaube sie für GainPilot in den Einstellungen deines ${NATIV?"Telefons":"Browsers"}, sonst kommt keine Erinnerung an.</small></div>`:"";
 return st+`<div class="card">${sw("tr","Training","An deinen Trainingstagen"+(tage?" ("+tage+")":"")+". Lauftage aus deinem Laufplan zählen mit.")}

 <div class="card">${sw("wa","Wasser","Regelmäßig über den Tag verteilt.")}
 ${r.wa.on?`<div class="g2">${zeit("wa","von","Von",true)}${zeit("wa","bis","Bis",true)}</div>
 <label>Abstand</label><select class="n" onchange="remSet('wa','alle',+this.value)">${[[60,"jede Stunde"],[90,"alle 1,5 Stunden"],[120,"alle 2 Stunden"],[180,"alle 3 Stunden"]].map(([v,t])=>`<option value="${v}" ${(+r.wa.alle||120)==v?"selected":""}>${t}</option>`).join("")}</select>
 <small style="display:block;color:var(--mut)">${wasserN} Erinnerungen pro Tag</small>`:""}</div>

 ${r.es.on?`<div class="g2">${SLOTS.map(([sl,nm])=>zeit("es",sl,nm,false)).join("")}</div>`:""}</div>
 <small style="display:block;color:var(--mut);margin:8px 4px">${NATIV?"Die Erinnerungen plant dein Telefon selbst ein. Sie kommen auch, wenn die App geschlossen ist, und brauchen kein Internet.":"Im Browser kommen Erinnerungen nur, solange GainPilot geöffnet ist oder im Hintergrund läuft. Verlässlich und auch bei geschlossener App funktionieren sie in der installierten App aus dem Store."}</small>`;}
/* ---------- SUPPLEMENTS ---------- */
const suppByName=n=>(S.suppLib||[]).concat(SUPPS).find(x=>x.n===n);
const allSupps=()=>(S.suppLib||[]).concat(SUPPS);
const sdKey=(d,n)=>d+"|"+n;
function suppPlan(d){return S.supp[d]||[];}
function suppOf(d){
 return suppPlan(d).map(n=>{const x=suppByName(n);return {n,x,taken:!!S.suppDone[sdKey(d,n)]};});
}
function suppHinweisZeile(x){return x&&x.h?`<small style="color:var(--warn-t);display:block">ℹ️ ${esc(x.h)}</small>`:"";}
function suppTemplate(n){
 const t={"Basis":["Vitamin D3","Magnesium"],"Muskelaufbau":["Kreatin","Whey-Protein","Vitamin D3","Magnesium","Omega-3 (Fischöl)"],"Abnehmen":["Whey-Protein","Multivitamin","Omega-3 (Fischöl)"]}[n];
 if(!t)return;
 const d=dISO(S.wk,S.day);
 if(!confirm("Vorlage „"+n+"“ auf "+fmtDay(S.wk,S.day)+" setzen? Vorhandenes wird ersetzt."))return;
 S.supp[d]=t.slice();save();logInfo("supplement","Vorlage gesetzt",{name:n,datum:d});render();
}
function dayShift(n){const d=dateOf(S.wk,S.day);d.setDate(d.getDate()+n);S.wk=weekKey(d);S.day=dayIndex(d);S.wkLock=true;save();render();}
function tagMinus(iso,n){const t=new Date(iso+"T12:00:00");t.setDate(t.getDate()-n);return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0");}
function suppSerie(n){ // aufeinanderfolgende GEPLANTE Tage, an denen genommen wurde (ungeplante Tage unterbrechen nicht)
 const heute=todayISO(),erst=Object.keys(S.supp||{}).sort()[0];if(!erst)return 0;
 let serie=0;
 for(let i=0;i<730;i++){const d=tagMinus(heute,i);if(d<erst)break;
  if(!suppPlan(d).includes(n))continue;
  if(S.suppDone[sdKey(d,n)])serie++;
  else if(i==0)continue; // heute noch offen: Serie nicht abbrechen
  else break;}
 return serie;
}
function suppSearch(){
 const q=($("#sq")&&$("#sq").value||"").toLowerCase().trim();
 if(!q){$("#sres").innerHTML="";return;}
 const r=allSupps().filter(x=>x.n.toLowerCase().includes(q)).slice(0,6);
 $("#sres").innerHTML=r.map(x=>`<div class="opt" onclick="suppAdd('${jq(x.n)}')"><b>${esc(x.n)}</b><small>${x.e?esc(x.e):""}${x.w?" · "+esc(x.w):""}</small>${suppHinweisZeile(x)}</div>`).join("")||"<small>Nichts gefunden.</small>";
}
function suppAdd(n){const d=dISO(S.wk,S.day);S.supp[d]=S.supp[d]||[];if(!S.supp[d].includes(n))S.supp[d].push(n);
 logInfo("supplement","Präparat aufgenommen",{tag:d,name:n});save();render();}
function suppRemove(d,n){S.supp[d]=(S.supp[d]||[]).filter(x=>x!==n);delete S.suppDone[sdKey(d,n)];save();render();}
function suppTick(d,n){const k=sdKey(d,n);const war=S.suppDone[k];if(war)delete S.suppDone[k];else S.suppDone[k]=1;
 logInfo("supplement",war?"Einnahme zurückgenommen":"Einnahme abgehakt",{datum:d,name:n});save();render();}
function suppWeek(von,an){
 if(!an){if(!confirm("Alle Präparate dieser Woche entfernen?"))return;
  for(let i=0;i<7;i++){const d=dISO(S.wk,i);delete S.supp[d];
   Object.keys(S.suppDone).forEach(k=>{if(k.startsWith(d+"|"))delete S.suppDone[k]});}
  save();logInfo("supplement","Woche geleert",{woche:S.wk});render();return;}
 if(!confirm("Präparate dieses Tages auf alle Tage der Woche setzen?"))return;
 const q=suppPlan(von).slice();
 for(let i=0;i<7;i++)S.supp[dISO(S.wk,i)]=q.slice();
 save();logInfo("supplement","Tag auf Woche kopiert",{tag:von});render();
}

 sheet(`<h4>Eigenes Präparat</h4><label>Name</label><input class="n" id="sn">
 <label>Menge (z. B. 375 mg)</label><input class="n" id="se">
 <label>Einnahmezeitpunkt</label><input class="n" id="sw" placeholder="z. B. abends">

/* ---------- ZIELE ---------- */
function viewGoal(){
 let h=`<div class="card"><h4>Tagesziele</h4>
 <small style="display:block;color:var(--mut);margin:-4px 0 8px">Schnellwahl</small><div class="chips" style="margin-bottom:12px"><button class="p" onclick="preset(1900,150)">Abnehmen</button><button class="p" onclick="preset(2800,170)">Muskelaufbau</button></div>
 <label>Kalorien (kcal)</label><input class="n" type="number" inputmode="numeric" value="${S.kcal}" onchange="zielSetzen('kcal',this.value)">
 <label>Eiweiß (g)</label><input class="n" type="number" inputmode="numeric" value="${S.prot}" onchange="zielSetzen('prot',this.value)">
 <label>Kohlenhydrate (g, optional)</label><input class="n" type="number" inputmode="numeric" value="${S.kh||""}" onchange="zielSetzen('kh',this.value)">
 <label>Fett (g, optional)</label><input class="n" type="number" inputmode="numeric" value="${S.fett||""}" onchange="zielSetzen('fett',this.value)">
 <button class="btn g" onclick="uebernehmeAusTag()">Nährwerte des Tages übernehmen</button>
 <button class="btn g" onclick="uebernehmeAusWoche()">Wochenschnitt übernehmen</button>
 <small style="display:block;color:var(--mut);margin-top:10px">Die Vorlagen sind grobe Richtwerte. Faustregel: 1,6 bis 2,2 g Eiweiß pro kg Körpergewicht; zum Abnehmen etwa 300 bis 500 kcal unter dem Bedarf, für Muskelaufbau etwa 200 bis 300 kcal darüber. </small></div>
 <div class="card"><h4>Wochenkarte</h4><small style="display:block;color:var(--mut);margin-bottom:8px">Alle Wochen mit Einträgen. Antippen öffnet die Woche.</small>
 ${(()=>{const wo={};Object.keys(S.plan||{}).forEach(k=>{const w=k.split("|")[0];wo[w]=(wo[w]||0)+1});
  Object.keys(S.log||{}).forEach(d=>{const w=weekKey(dateOf(d,0));wo[w]=(wo[w]||0)+1});
  const ks=Object.keys(wo).sort().reverse();
  if(!ks.length)return "<div class='empty'>Noch keine Wochen angelegt.</div>";
  return ks.slice(0,14).map(w=>`<div class="row"><span>${fmtWeek(w)}${w==weekOf(0)?" (aktuell)":""}</span><span><button class="btn g" style="padding:6px 12px;margin:0" onclick="openWeek('${w}')">öffnen</button></span></div>`).join("");})()}
 </div>`;
 return h;
}
function zielSetzen(k,v){const G={kcal:[800,8000,"Kalorien"],prot:[20,500,"Eiweiß"],kh:[0,1500,"Kohlenhydrate"],fett:[0,500,"Fett"]}[k],x=Math.round(+v);
 if((k=="kh"||k=="fett")&&!(x>0)){S[k]=null;save();render();return;}
 if(!(x>=G[0]&&x<=G[1])){toast(G[2]+": bitte einen Wert zwischen "+G[0]+" und "+G[1]+" eingeben.");render();return;}
 S[k]=x;save();render();}
function openWeek(w){S.wk=w;S.weekView=w;S.day=0;S.wkLock=true;save();tab="plan";sub.plan="plan";render();}
function preset(k,p){S.kcal=k;S.prot=p;save();render();toast("Tagesziel gesetzt: "+k+" kcal und "+p+" g Eiweiß.");}
/* ---------- GEGESSEN ---------- */
function wasserKarte(isoD){
 const ml=((S.water||{})[isoD])||0,ziel=S.waterGoal||2500,f=x=>(x/1000).toFixed(2).replace(".",",");
 return `<div class="card"><div class="row" style="margin-top:0"><b>Wasser</b><span>${f(ml)} von ${(ziel/1000).toFixed(1).replace(".",",")} l</span></div>
 <div class="bar"><i class="w" style="width:${Math.min(100,Math.round(ml/ziel*100))}%"></i></div>
 <div class="chips"><button onclick="wasser(-250)" aria-label="250 ml weniger">−</button><button class="p" onclick="wasser(250)">+ Glas</button><button class="p" onclick="wasser(500)">+ Flasche</button><button onclick="wasserZielForm()">Ziel</button></div></div>`;
}
function wasser(dml){const d=dISO(S.wk,S.day);S.water=S.water||{};S.water[d]=Math.max(0,Math.min(10000,(S.water[d]||0)+dml));if(!S.water[d])delete S.water[d];save();render();}
function wasserZielForm(){sheet(`<h4>Wasser-Tagesziel</h4><label>Milliliter pro Tag</label><input class="n" id="wzv" type="number" inputmode="numeric" value="${S.waterGoal||2500}">
 <button class="btn" onclick="const v=parseInt($('#wzv').value);if(v>=500&&v<=8000){S.waterGoal=v;save();closeSheet();render();}else toast('Bitte einen Wert zwischen 500 und 8000 ml eingeben.')">Speichern</button><button class="btn g" onclick="closeSheet()">Abbrechen</button>`);}
function ringSvg(v,max){const R=54,C=2*Math.PI*R,pc=Math.max(0,Math.min(1,max>0?v/max:0)),over=v>max*1.05;
 return `<svg viewBox="0 0 132 132" width="132" height="132" aria-hidden="true"><circle cx="66" cy="66" r="${R}" fill="none" stroke="var(--line)" stroke-width="12"/><circle cx="66" cy="66" r="${R}" fill="none" stroke="${over?'var(--danger)':'var(--heat)'}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${(C*pc).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 66 66)"/></svg>`;}
const nf=x=>Math.round(x).toLocaleString("de-DE");
function mxRow(l,v,ziel,cls){const pc=ziel>0?Math.min(100,v/ziel*100):0;
 return `<div class="r1"><b>${l}</b><span>${Math.round(v)}${ziel>0?" / "+Math.round(ziel):""} g</span></div><div class="bar"><i class="${cls}" style="width:${pc}%"></i></div>`;}
const CHK='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
let ADD_SLOT=null;
const SLOT_IC={f:"☕",m:"🥗",a:"🍽",s:"🍎"};
function slotJetzt(){const h=new Date().getHours()+new Date().getMinutes()/60;return h<10.5?"f":h<14.5?"m":h<17.5?"s":"a";}
function suppSlot(x){const w=((x&&x.w)||"").toLowerCase();return /morgen|früh|nüchtern/.test(w)?"f":/mittag/.test(w)?"m":/abend|schlaf|nacht/.test(w)?"a":"";}
function suppRow(isoD,x){const info=x.x||{};return `<div class="mrow"><button class="chkc pill ${x.taken?'on':''}" aria-label="${x.taken?'Als nicht genommen markieren':'Als genommen markieren'}" onclick="suppTick('${isoD}','${jq(x.n)}')">${CHK}</button>
 <div class="t"><b>💊 ${esc(x.n)}</b><small>${[info.e,info.w].filter(Boolean).map(esc).join(" · ")}${suppSerie(x.n)>=2?" · 🔥 "+suppSerie(x.n)+" Tage":""}</small></div></div>`;}
function viewEat(){
 const isoD=dISO(S.wk,S.day),t=eaten(isoD),log=S.log[isoD]||[],rest=S.kcal-t.k,key=pk(S.wk,S.day);
 let h=weekBar();
 if(isoD==todayISO())h+=serieZeile(essSerie(),"Tage in Folge mit Essprotokoll");
 h+=`<div class="card"><div class="hero"><div class="ring">${ringSvg(t.k,S.kcal)}<div class="c"><b>${nf(Math.abs(rest))}</b><span>${rest>=0?"kcal übrig":"kcal drüber"}</span></div></div>
 <div class="mx">${mxRow("Eiweiß",t.p,S.prot,"")}${mxRow("Kohlenhydrate",t.h,S.kh,"kh")}${mxRow("Fett",t.f,S.fett,"fe")}</div></div>
 <div class="sum">${nf(t.k)} von ${nf(S.kcal)} kcal gegessen</div></div>`;
 const pl=entries(S.wk,S.day),refs=pl.map(({s,i,e})=>key+s+i+":"+e.id+":"+e.q);
 const sup=suppOf(isoD),supUsed=new Set();
 const extra=log.map((e,i)=>({e,i})).filter(({e})=>!e.ref||!refs.includes(e.ref));
 SLOTS.forEach(([s,name])=>{
  const it=pl.filter(x=>x.s==s),ex=extra.filter(({e})=>e.s==s),sp=sup.filter(x=>suppSlot(x.x)==s);sp.forEach(x=>supUsed.add(x.n));
  const ist=it.filter(({i,e})=>log.some(x=>x.ref==key+s+i+":"+e.id+":"+e.q)).reduce((a,{e,m})=>a+m.k*e.q,0)+ex.reduce((a,{e})=>a+(+e.k||0),0);
  const soll=it.reduce((a,{e,m})=>a+m.k*e.q,0);
  h+=`<div class="card meal-c"><div class="mh"><span class="mi">${SLOT_IC[s]}</span><b>${name}</b><span class="mk">${soll?nf(ist)+" / "+nf(soll):nf(ist)} kcal</span></div>`;
  it.forEach(({i,e,m})=>{const on=log.some(x=>x.ref==key+s+i+":"+e.id+":"+e.q);
   h+=`<div class="mrow"><button class="chkc ${on?'on':''}" aria-label="${on?'Als nicht gegessen markieren':'Als gegessen markieren'}" onclick="tickPlan('${s}',${i})">${CHK}</button>
   <div class="t" onclick="showRecipe(${m.id})"><b>${esc(m.n)}</b><small>${e.q!=1?String(e.q).replace(".",",")+"× · ":""}${Math.round(m.k*e.q)} kcal · ${Math.round(m.p*e.q)} g Eiweiß</small></div></div>`;});
  ex.forEach(({e,i})=>{h+=`<div class="mrow"><span class="chkc on dot" aria-hidden="true">${CHK}</span><div class="t"><b>${esc(e.n)}</b><small>${Math.round(e.k)} kcal · ${Math.round(e.p)} g Eiweiß</small></div><button class="x" aria-label="Eintrag löschen" onclick="delLog(${i})">✕</button></div>`;});
  sp.forEach(x=>{h+=suppRow(isoD,x);});
  h+=`<button class="addl" onclick="addSheet('${s}')">+ ${name} hinzufügen</button></div>`;});
 const rest2=extra.filter(({e})=>!e.s||!SLOTS.some(([s])=>s==e.s)),spRest=sup.filter(x=>!supUsed.has(x.n));
 if(rest2.length){h+=`<div class="card meal-c"><div class="mh"><span class="mi">📝</span><b>Weitere Einträge</b><span class="mk">${nf(rest2.reduce((a,{e})=>a+(+e.k||0),0))} kcal</span></div>`;
  rest2.forEach(({e,i})=>{h+=`<div class="mrow"><span class="chkc on dot" aria-hidden="true">${CHK}</span><div class="t"><b>${esc(e.n)}</b><small>${Math.round(e.k)} kcal · ${Math.round(e.p)} g Eiweiß</small></div><button class="x" aria-label="Eintrag löschen" onclick="delLog(${i})">✕</button></div>`;});
  h+=`</div>`;}
 if(spRest.length){const n=spRest.filter(x=>x.taken).length;
  h+=`<div class="card meal-c"><div class="mh"><span class="mi">💊</span><b>Supplements</b><span class="mk">${n} von ${spRest.length}</span></div>${spRest.map(x=>suppRow(isoD,x)).join("")}</div>`;}
 if(!pl.length&&!log.length)h+=`<div class="hint">Für diesen Tag ist noch nichts geplant. <button class="lnk" onclick="tab='plan';sub.plan='plan';render()">Im Wochenplan planen</button></div>`;
 h+=runHeute();
 h+=wasserKarte(isoD);
 h+=`<button class="fab" onclick="addSheet()"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Essen</button><div style="height:64px" aria-hidden="true"></div>`;
 return h;
}
function addSheet(slot){
 ADD_SLOT=slot||slotJetzt();
 const isoD=dISO(S.wk,S.day),zl=zuletztGegessen(isoD).slice(0,4);
 const o=(ic,t,sm,fn)=>`<div class="opt" onclick="${fn}"><span class="ic2">${ic}</span><div><b>${t}</b><small>${sm}</small></div></div>`;
 sheet(`<h4>Essen hinzufügen</h4><div class="chips" style="margin:-2px 0 8px">${SLOTS.map(([s,n])=>`<button class="${ADD_SLOT==s?'p':''}" onclick="addSheet('${s}')">${SLOT_IC[s]} ${n}</button>`).join("")}</div>
 ${o("📷","Foto analysieren","Die KI schätzt Kalorien und Eiweiß","photoStart()")}
 ${o("▥","Barcode scannen","Packungen aus der Datenbank","B={items:[],name:''};bcStart()")}
 ${o("🔎","Lebensmittel suchen","Datenbank mit Mengenangabe","builder([],'','')")}
 ${o("🍽","Gericht aus der Liste","Eigene Gerichte und Rezepte","eatPick()")}
 ${o("✏️","Selbst eintragen","Name und Nährwerte von Hand","freeForm()")}
 ${zl.length?`<h4 style="margin-top:14px">Zuletzt gegessen</h4>`+zl.map((e,i)=>`<div class="mrow"><div class="t"><b>${esc(e.n)}</b><small>${Math.round(e.k)} kcal · ${Math.round(e.p)} g Eiweiß</small></div><button class="ok" onclick="closeSheet();nochmal(${i})">+ nochmal</button></div>`).join("")+`<button class="btn g" onclick="closeSheet();gesternNochmal()">Alles von gestern übernehmen</button>`:""}
 <button class="btn g" style="width:100%;margin-top:10px" onclick="closeSheet()">Schließen</button>`);
}
function tickPlan(s,i){
 const isoD=dISO(S.wk,S.day),key=pk(S.wk,S.day),e=(S.plan[key+s]||[])[i];
 if(!e)return;
 const m=meal(e.id),ref=key+s+i+":"+e.id+":"+e.q;
 S.log[isoD]=S.log[isoD]||[];const ix=S.log[isoD].findIndex(x=>x.ref==ref);
 if(ix>=0)S.log[isoD].splice(ix,1);
 else S.log[isoD].push({ref,n:m.n,k:m.k*e.q,p:m.p*e.q,h:m.h*e.q,f:m.f*e.q});
 save();logInfo("protokoll",ix>=0?"geplantes Gericht entfernt":"geplantes Gericht abgehakt",{tag:ref});
 render();
}
function zuletztGegessen(bisD){
 const ds=Object.keys(S.log||{}).filter(d=>d!==bisD).sort().reverse(),out=[],seen={};
 for(const d of ds){for(const e of (S.log[d]||[]).slice().reverse()){const n=e.n.replace(/\s*\(.*?\)\s*$/,"");if(seen[n]||!(e.k>0))continue;seen[n]=1;out.push(e);if(out.length>=6)break;}if(out.length>=6)break;}
 window._zl=out;return out;
}
function nochmal(i){const e=(window._zl||[])[i];if(!e)return;const d=dISO(S.wk,S.day);(S.log[d]=S.log[d]||[]).push({s:ADD_SLOT||e.s||undefined,n:e.n,k:e.k,p:e.p,h:e.h,f:e.f});save();render();}
function gesternNochmal(){
 const d=dISO(S.wk,S.day),t=new Date(d+"T12:00:00");t.setDate(t.getDate()-1);
 const v=t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0");
 const src=(S.log[v]||[]);if(!src.length){toast("Für gestern ist nichts protokolliert.");return;}
 if(!confirm(src.length+" Einträge von gestern zu heute hinzufügen?"))return;
 S.log[d]=S.log[d]||[];src.forEach(e=>S.log[d].push({s:e.s||(e.ref?e.ref.split("|")[1].replace(/^\d+/,"")[0]:undefined),n:e.n,k:e.k,p:e.p,h:e.h,f:e.f}));save();render();
}
function delLog(i){const d=dISO(S.wk,S.day);S.log[d].splice(i,1);save();render();}
function eatPick(){sheet(pickerHtml("","eatMeal","Gericht wählen"));}
function eatMeal(id){const m=meal(id);
 sheet(`<h4>${esc(m.n)}</h4><label>Portionen</label><input class="n" id="eq" type="number" step="0.5" value="1" inputmode="decimal">
 <button class="btn" onclick="logMeal(${id})">Eintragen</button><button class="btn g" onclick="closeSheet()">Abbrechen</button>`);}
function logMeal(id){const m=meal(id),q=Math.max(0.25,Math.min(20,parseFloat($("#eq").value.replace(",","."))||1));
 const dch=dISO(S.wk,S.day);(S.log[dch]=S.log[dch]||[]).push({s:ADD_SLOT||undefined,n:m.n+(q!=1?` (${q}×)`:""),k:m.k*q,p:m.p*q,h:m.h*q,f:m.f*q});save();closeSheet();render();}
function freeForm(){
 sheet(`<h4>Etwas anderes gegessen</h4><label>Was?</label><input class="n" id="gn" placeholder="z. B. Pizza, Eis, Döner">
 <div class="g2"><input class="n" id="gk" type="number" inputmode="decimal" placeholder="kcal"><input class="n" id="gp" type="number" inputmode="decimal" placeholder="Eiweiß (g)">
 <input class="n" id="gh" type="number" inputmode="decimal" placeholder="Kohlenhydrate (g)"><input class="n" id="gf" type="number" inputmode="decimal" placeholder="Fett (g)"></div>
 <small>Werte sind optional, aber nur eingetragene Werte zählen. Schätzung reicht.</small><br>
 <button class="btn" onclick="logFree()">Eintragen</button><button class="btn g" onclick="closeSheet()">Abbrechen</button>`);}
function logFree(){const n=$("#gn").value.trim();if(!n){toast("Bitte eingeben, was du gegessen hast.");return;}
 const v=x=>parseFloat($(x).value.replace(",","."))||0;
 const dch=dISO(S.wk,S.day);(S.log[dch]=S.log[dch]||[]).push({s:ADD_SLOT||undefined,n,k:v("#gk"),p:v("#gp"),h:v("#gh"),f:v("#gf")});save();closeSheet();render();}
function viewWeek(){
 const wk=S.weekView||S.wk;
 let h=`<div class="wkpick"><button class="nav" aria-label="Vorherige Woche" onclick="weekShift(-1)">‹</button><span>${fmtWeek(wk)}</span><button class="nav" aria-label="Nächste Woche" onclick="weekShift(1)">›</button></div>`;
 h+=`<div class="card"><h4>Plan und tatsächlich</h4><small style="display:block;color:var(--mut);margin:-6px 0 4px">Ziel pro Tag: ${nf(S.kcal)} kcal · ${S.prot} g Eiweiß</small>`;
 let sk=0,sp=0,n=0,eingeplant=0;
 for(let i=0;i<7;i++){
  const p=totals(wk,i),e=eaten(dISO(wk,i)),erfasst=(S.log[dISO(wk,i)]||[]).length;eingeplant+=p.k;
  if(erfasst){n++;sk+=e.k;sp+=e.p;}
  h+=`<div class="dayr"><div class="row" style="margin:0"><b>${fmtDay(wk,i)}</b><span>${erfasst?nf(e.k)+" kcal · "+Math.round(e.p)+" g Eiweiß":"nicht erfasst"}</span></div>
  ${erfasst?bar("",e.k||0,S.kcal,""):""}${p.k?`<small>geplant: ${nf(p.k)} kcal · ${Math.round(p.p)} g Eiweiß</small>`:""}</div>`;}
 if(n)h+=`<hr><div class="row"><b>Ø an ${n} Tag(en)</b><span>${Math.round(sk/n)} kcal · ${Math.round(sp/n)} g Eiweiß</span></div>`;
 h+=`</div><div class="card"><h4>Wochenbilanz</h4>
 <div class="row"><span>Gegessen</span><span>${Math.round(sk)} kcal</span></div>
 <div class="row"><span>Ziel für 7 Tage</span><span>${S.kcal*7} kcal</span></div>
 <div class="row"><span>Differenz</span><span>${Math.round(sk-S.kcal*7)} kcal</span></div>
 <div class="row"><span>Eingeplant</span><span>${Math.round(eingeplant)} kcal</span></div></div>`;
 const alt=calorieDays().filter(d=>d<dISO(wk,0)).slice(-14).reverse();
 if(alt.length){h+=`<div class="card"><h4>Frühere Tage</h4>`;
  alt.forEach(d=>{const e=eaten(d),dd=new Date(d+"T12:00:00");h+=`<div class="row"><span>${DAYS[dayIndex(dd)]} ${dd.getDate()}.${dd.getMonth()+1}.</span><span>${Math.round(e.k)} kcal · ${Math.round(e.p)} g Eiweiß</span></div>`;});
  h+=`</div>`;}
 return h;
}
function weekShift(n){const dd=dateOf(S.weekView||S.wk,0);dd.setDate(dd.getDate()+n*7);S.weekView=iso(dd);save();render();}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{const t=b.dataset.t;
 if(t=="eat"&&tab!="eat")S.wkLock=false;
 if(t=="more"&&tab=="more")S.mtab=null;
 if(t==tab)window.scrollTo({top:0,behavior:"smooth"});
 tab=t;render();});
// In der App externe Links im System-Browser öffnen
document.addEventListener("click",e=>{const a=e.target.closest&&e.target.closest("a[href^='http']");if(!a||!NATIV)return;e.preventDefault();const B=PL("Browser");if(B)B.open({url:a.href});else window.open(a.href,"_system");});
// Erster Start: kurze Einführung
if(!S.onb&&!Object.keys(S.log||{}).length&&!Object.keys(S.plan||{}).length)setTimeout(willkommen,300);else if(!S.onb){S.onb=1;save();}
// Beim Start immer mit dem heutigen Tag beginnen
S.wk=weekOf(0);S.day=dayIndex(new Date());S.wkLock=false;S.mtab=null;
let wegSeit=0;
try{kontoLinkPruefen();}catch(e){logErr("konto","Link: "+e.message);}
setTimeout(()=>{try{if(konto().status=="wartet")kontoPruefen(true);}catch(e){}},3000);
document.addEventListener("visibilitychange",()=>{if(document.hidden){wegSeit=Date.now();try{if(konto().status=="aktiv"&&konto().cloud)cloudJetzt(false);}catch(e){}return;}
 try{if(konto().status=="wartet")kontoPruefen(true);}catch(e){}
 if(wegSeit&&Date.now()-wegSeit>30*60000&&!document.querySelector(".modal")){S.wk=weekOf(0);S.day=dayIndex(new Date());S.wkLock=false;render();}});
render();
</script>
</body>
</html>
