<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1c7a4b">
<title>GainPilot</title>
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="GainPilot">
<meta name="application-name" content="GainPilot">
<meta name="description" content="Wochenplan, Einkaufsliste, Nährwerte, Training, Supplements und Gewicht">
<meta name="color-scheme" content="light dark">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
 --bg:#f1f3ee; --card:#ffffff; --line:#e1e5dc; --txt:#16201a; --mut:#5d6a61;
 --brand:#1c7a4b; --brand-d:#14573a; --brand-l:#e1f0e6;
 --danger:#c43030; --warn:#d98a0b; --warn-t:#8f5400; --blue:#2d6bd6; --teal:#0f857a; --heat:#e8742a;
 --r:18px; --sh:none;
}
@media (prefers-color-scheme:dark){:root{
 --bg:#0d1310; --card:#151d18; --line:#242f28; --txt:#eaf1ec; --mut:#8f9e94;
 --brand:#3ecf86; --brand-d:#86e6b4; --brand-l:#173424; --warn-t:#f0b44c; --heat:#f08a45; --danger:#ef6464;}
 .btn,.days button.on,.sub button.on,.tabs button.on,.ok.on,.add,.fab,.chkc.on{color:#04210f}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt);
 padding-bottom:calc(76px + env(safe-area-inset-bottom));font-size:15px;line-height:1.45}
header{position:sticky;top:0;z-index:6;background:var(--card);border-bottom:1px solid var(--line);
 padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
.hd{max-width:620px;margin:auto;display:flex;align-items:center;gap:10px}
.hd .logo{width:30px;height:30px;border-radius:9px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:16px}
.hd b{font-size:17px;letter-spacing:-.2px}
.hd small{display:block;color:var(--mut);font-size:12px;font-weight:500}
main{padding:12px 14px 4px;max-width:620px;margin:auto}
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--card);border-top:1px solid var(--line);
 display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;border:0;background:none;color:var(--mut);font-size:12px;font-weight:600;padding:6px 0;border-radius:12px;
 display:flex;flex-direction:column;align-items:center;gap:2px;font-family:inherit}
nav button i{font-size:20px;font-style:normal;line-height:1}
nav button.on{color:var(--brand);background:var(--brand-l)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:var(--sh)}
h3{margin:16px 0 8px;font-size:13px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.4px}
h4{margin:0 0 8px;font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.4px}
.sub{display:flex;gap:6px;margin-bottom:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;
 overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.sub::-webkit-scrollbar{display:none}
.sub button{flex:1 0 auto;min-width:max-content;white-space:nowrap;padding:9px 12px;border-radius:10px;border:0;background:none;
 color:var(--mut);font-size:13px;font-weight:600;font-family:inherit}
.sub button.on{background:var(--brand);color:#fff}
.tabs{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 auto;min-width:max-content;white-space:nowrap;padding:8px 12px;border-radius:10px;border:1px solid var(--line);
 background:var(--card);color:var(--mut);font-size:13px;font-weight:600;font-family:inherit}
.tabs button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.wkpick{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);
 border-radius:14px;padding:8px 10px;margin-bottom:10px;font-size:14px;font-weight:600}
.wkpick .nav{border:0;background:var(--bg);color:var(--txt);border-radius:10px;width:40px;height:38px;font-size:20px;font-family:inherit}
.days{display:flex;gap:7px;overflow-x:auto;padding-bottom:2px;margin-bottom:10px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.days button{flex:1;min-width:52px;padding:9px 2px;border-radius:14px;border:1px solid var(--line);background:var(--card);
 color:var(--txt);font-size:13px;font-weight:600;font-family:inherit;line-height:1.25}
.days button small{display:block;font-size:10px;font-weight:500;color:var(--mut)}
.days button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.days button.on small{color:#fff9}
.days button i{display:block;font-size:9px;font-style:normal;color:var(--brand);font-weight:700}
.days button.on i{color:#fff}
.meal{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.meal:last-child{margin-bottom:0}
.meal b{font-size:15px;font-weight:650;letter-spacing:-.1px}
.meal small{color:var(--mut);display:block;margin-top:3px;font-size:12.5px}
.pick{width:100%;padding:13px;border:1.5px dashed var(--line);border-radius:12px;background:none;color:var(--mut);
 font-size:14px;font-weight:600;margin-top:6px;font-family:inherit}
.pick:active{background:var(--bg)}
.x{border:0;background:transparent;color:var(--danger);padding:8px;font-size:17px;font-family:inherit}
.ok{border:0;background:var(--brand-l);color:var(--brand-d);border-radius:10px;padding:9px 12px;font-size:13.5px;
 font-weight:600;white-space:nowrap;font-family:inherit}
.ok.on{background:var(--brand);color:#fff}
.step{display:flex;align-items:center;gap:4px;margin-top:8px;font-size:13.5px;color:var(--mut)}
.step button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--txt);
 font-size:17px;line-height:1;font-family:inherit}
.step .ok{margin-left:6px}
.bar{height:8px;background:var(--bg);border-radius:99px;overflow:hidden;margin:5px 0 12px}
.bar i{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .25s}
.bar i.over{background:var(--danger)}
.row{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;margin:4px 0}
.row span:last-child{color:var(--mut);text-align:right}
.row b{font-weight:650}
.modal{position:fixed;inset:0;background:rgba(16,24,40,.45);backdrop-filter:blur(2px);z-index:20;display:flex;align-items:flex-end}
.sheet{background:var(--card);width:100%;max-height:88vh;overflow:auto;border-radius:22px 22px 0 0;
 padding:18px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px #0003}
.opt{padding:13px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.opt:last-child{border-bottom:0}
.opt b{font-weight:650;font-size:15px}
.opt small{color:var(--mut);display:block;font-size:12.5px;margin-top:2px}
.chk{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);font-size:15px}
.chk input{width:22px;height:22px;accent-color:var(--brand)}
.chk.done span{text-decoration:line-through;color:var(--mut)}
input.n,select.n,textarea.n{width:100%;padding:12px;font-size:16px;background:var(--bg);color:var(--txt);
 border:1px solid var(--line);border-radius:12px;margin:5px 0 12px;font-family:inherit}
input.n:focus,select.n:focus,textarea.n:focus{outline:2px solid var(--brand);outline-offset:0;border-color:transparent}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.btn{padding:12px 16px;border:0;border-radius:12px;background:var(--brand);color:#fff;font-size:14.5px;font-weight:600;
 margin:4px 6px 4px 0;font-family:inherit;box-shadow:var(--sh)}
.btn.g{background:var(--card);color:var(--txt);border:1px solid var(--line);box-shadow:none}
.btn.b{background:var(--blue)}.btn.t{background:var(--teal)}
label{font-size:13px;color:var(--mut);font-weight:600}
.tag{font-size:11px;background:var(--brand-l);color:var(--brand-d);border-radius:6px;padding:2px 7px;margin-left:6px;font-weight:600}
.ph{width:100%;max-height:240px;object-fit:contain;border-radius:12px;margin:10px 0;background:var(--bg)}
.spin{padding:24px;text-align:center;color:var(--mut)}
.empty{padding:22px 14px;text-align:center;color:var(--mut);font-size:14px}
.badge{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--brand-l);color:var(--brand-d)}
hr{border:0;border-top:1px solid var(--line);margin:12px 0}

/* ===== v2.2 Oberfläche ===== */
body{padding-top:calc(10px + env(safe-area-inset-top));padding-bottom:calc(84px + env(safe-area-inset-bottom));font-size:15px}
main{padding:6px 14px 4px}
.card{padding:16px;border-radius:var(--r);box-shadow:none}
h3,h4{text-transform:none;letter-spacing:-.1px;color:var(--txt);font-size:16px;font-weight:700;margin:0 0 10px}
nav{padding:6px 4px calc(6px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(10px)}
nav button{font-size:11px;font-weight:600;gap:3px;padding:4px 0;background:none!important;color:var(--mut)}
nav button .ic{display:grid;place-items:center;width:56px;height:30px;border-radius:99px;transition:background .15s}
nav button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--brand)}
nav button.on .ic{background:var(--brand-l)}
nav button.on svg{stroke-width:2.2}
.sub{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:2px;overflow:hidden;padding:3px;border-radius:14px;background:var(--line);border:0;margin-bottom:12px}
.sub button{min-width:0;padding:9px 2px;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-radius:11px}
.sub button.on{background:var(--card);color:var(--txt);box-shadow:0 1px 3px #0002}
.wkpick{background:none;border:0;padding:2px 0;margin-bottom:6px}
.wkpick .nav{background:var(--card);border:1px solid var(--line);border-radius:50%;width:36px;height:36px;font-size:18px;color:var(--txt)}
.wkpick span{display:flex;align-items:center;gap:8px;font-size:15px}
.wkpick .heute{border:0;background:var(--brand-l);color:var(--brand-d);font-weight:700;font-size:12px;padding:5px 10px;border-radius:99px;font-family:inherit}
.days{gap:5px;margin-bottom:12px}
.days button{min-width:0;padding:7px 0 6px;border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:1px;background:none;border-color:transparent;color:var(--mut);font-size:12px;font-weight:600}
.days button small{font-size:15px;font-weight:700;color:var(--txt);font-variant-numeric:tabular-nums}
.days button i{display:block;width:5px;height:5px;border-radius:50%;background:var(--brand);font-size:0;margin-top:1px;min-height:5px;color:transparent}
.days button:not(:has(i)){padding-bottom:12px}
.days button.td{border-color:var(--brand)}
.days button.on{background:var(--brand);border-color:var(--brand);color:#ffffffcc}
.days button.on small{color:#fff}.days button.on i{background:#fff}
.days button b{font-size:15px;font-variant-numeric:tabular-nums}
.btn{box-shadow:none;border-radius:13px;padding:12px 16px}
.btn.g{background:var(--card)}
.ok{border-radius:99px}
.hero{display:flex;gap:18px;align-items:center}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1.1}
.ring .c b{font-size:30px;font-weight:760;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.ring .c span{font-size:12px;color:var(--mut);margin-top:3px}
.mx{flex:1;min-width:0}
.mx .r1{display:flex;justify-content:space-between;font-size:13px;gap:6px}
.mx .r1 span{color:var(--mut);font-variant-numeric:tabular-nums}
.mx .bar{height:6px;margin:4px 0 11px}.mx .bar:last-child{margin-bottom:0}
.bar i.kh{background:var(--blue)}.bar i.fe{background:var(--warn)}.bar i.w{background:var(--blue)}
.sum{font-size:13px;color:var(--mut);margin:12px 0 0;text-align:center}
.sl{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--mut);margin:16px 0 0}
.sl:first-of-type{margin-top:0}
.mrow{display:flex;align-items:center;gap:12px;padding:10px 0}
.mrow+.mrow{border-top:1px solid var(--line)}
.mrow .t{flex:1;min-width:0}
.mrow .t b{display:block;font-weight:600;font-size:15px;line-height:1.3}
.mrow .t small{display:block;color:var(--mut);font-size:12.5px;margin-top:1px}
.chkc{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);background:none;flex:none;display:grid;place-items:center;color:transparent;padding:0}
.chkc svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.chkc.on{background:var(--brand);border-color:var(--brand);color:#fff}
.lnk{border:0;background:none;color:var(--brand);font-weight:650;font-size:14px;padding:8px 0;font-family:inherit}
.add{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border-radius:16px;border:0;background:var(--brand);color:#fff;font-size:16px;font-weight:700;font-family:inherit;margin:2px 0 12px}
.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:5;display:flex;align-items:center;gap:7px;padding:14px 20px;border-radius:99px;border:0;background:var(--brand);color:#fff;font-size:15.5px;font-weight:700;font-family:inherit;box-shadow:0 6px 18px #0004}
.fab svg,.add svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--bg);color:var(--txt);border-radius:99px;padding:8px 14px;font-size:13.5px;font-weight:600;font-family:inherit}
.chips button.p{background:var(--brand-l);border-color:transparent;color:var(--brand-d)}
.slim{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--warn);border-radius:14px;padding:8px 8px 8px 14px;margin:4px 0 12px;font-size:13.5px}
.slim span{flex:1}.slim button{border:0;border-radius:99px;padding:8px 14px;font-size:13px;font-weight:700;font-family:inherit;background:var(--brand);color:#fff}
.slim button.g{background:none;color:var(--mut);padding:8px}
details.card>summary{font-weight:700;font-size:16px;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:"›";font-size:22px;color:var(--mut);transition:transform .15s}
details.card[open]>summary::after{transform:rotate(90deg)}
details.card[open]>summary{margin-bottom:10px}
.opt .ic2{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:12px;background:var(--brand-l);color:var(--brand-d);margin-right:12px;vertical-align:middle;font-size:18px}
.opt{display:flex;align-items:center;padding:11px 2px}
.opt>div{flex:1;min-width:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
button:focus-visible,a:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.gp{background:var(--brand-l);color:var(--brand-d);border-radius:12px;padding:8px 12px;margin:0 0 12px;font-size:14px;text-align:center;position:sticky;top:0}
.gp b{font-variant-numeric:tabular-nums;font-size:16px}
.serie{display:flex;align-items:center;gap:6px;background:var(--brand-l);color:var(--brand-d);border-radius:14px;padding:9px 14px;margin:0 0 12px;font-size:14px}.serie b{font-size:17px;font-variant-numeric:tabular-nums}
.gymz{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:0 0 10px}.gymz>span{font-size:20px}.gymz small{display:block;color:var(--mut)}
.gymz.on{background:var(--brand-l);border-color:transparent}.gymz.on small{color:var(--brand-d)}
.gwz{font-size:13px;color:var(--mut);margin:-2px 2px 10px}.gwz.on{color:var(--brand-d);font-weight:600}
.gwt{font-size:13px;color:var(--mut);margin:4px 0 0}.gwt.on{color:var(--brand-d);font-weight:700}
.gslots{display:flex;justify-content:center;gap:5px;flex-wrap:wrap;min-height:50px;margin:14px 0 16px}
.gslots span{width:30px;height:44px;border-bottom:3px solid var(--line);font-size:24px;font-weight:800;display:grid;place-items:center}
.gslots.ok span{color:var(--brand);border-color:var(--brand)}.gslots.bad span{color:var(--danger);border-color:var(--danger)}
.gletters{display:grid;grid-template-columns:repeat(auto-fit,minmax(48px,1fr));gap:8px}
.gletters button{min-height:52px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--txt);font-size:22px;font-weight:800;font-family:inherit;touch-action:manipulation}
.gletters button:disabled{opacity:.25}
.athk{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 14px;margin:0 0 10px;font:inherit;color:var(--txt);cursor:pointer}
.athk>div{flex:1;min-width:0}.athk b{font-size:15px}.athk small{color:var(--mut);font-size:12px}
.athl{flex:none;display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:var(--brand);color:#fff;font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}
.smk{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin:0 0 12px;display:flex;flex-direction:column;gap:8px}
.smk small{color:var(--mut);font-size:13px;line-height:1.4}.smk .btn{margin:0}.smk.on{background:var(--brand-l);border-color:transparent}.smk.on small{color:var(--brand-d)}
.vs.pl{background:var(--bg)}
.avg{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;margin:4px 0 6px}

label.ck{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.45;color:var(--txt);font-weight:400}label.ck input{margin-top:3px;flex:none;width:18px;height:18px}
.rll{display:flex;flex-direction:column;gap:4px}
.rlz{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:12px;border:1px solid var(--line)}
.rlz.ich{background:var(--brand-l);border-color:transparent}.rlz.auf{box-shadow:inset 3px 0 0 var(--brand)}.rlz.ab{box-shadow:inset 3px 0 0 var(--danger)}
.rlp{width:22px;text-align:right;font-variant-numeric:tabular-nums;color:var(--mut);font-size:13px}.rla{font-size:20px}.rln{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rlz b{font-variant-numeric:tabular-nums}.rlm{width:32px;height:32px;border:0;background:none;color:var(--mut);font-size:15px;flex:none}

.gscore{font-size:30px;font-weight:760;text-align:center;margin:8px 0;font-variant-numeric:tabular-nums}
.gres{text-align:center}.gover{text-align:center;padding:6px 0}.gover b{font-size:20px}

.gseq,.ggrid{display:grid;gap:10px;margin:16px auto}.gseq{grid-template-columns:1fr 1fr;max-width:300px}.ggrid{grid-template-columns:repeat(4,1fr)}

.gcol.r{background:#e25555}.gcol.b{background:#4a8cf0}.gcol.y{background:#e8bd3f}.gcol.g{background:#3cbf7a}
.gtile{height:62px;border:0;border-radius:12px;background:var(--line);color:var(--txt);font-size:22px;font-weight:700;font-family:inherit;touch-action:manipulation}

let LOGS=[],LSEQ=0;
(function(){try{LOGS=JSON.parse(localStorage.getItem(LOGKEY)||"[]")}catch(e){LOGS=[]}})();
function logSave(){try{localStorage.setItem(LOGKEY,JSON.stringify(LOGS))}catch(e){}}
function logAdd(level,area,msg,data){
 LSEQ++;
 const e={i:LSEQ,t:new Date().toISOString(),lv:level,a:area,m:String(msg).slice(0,600)};
 if(data!==undefined){try{e.d=JSON.stringify(data).slice(0,2000)}catch(_){e.d="[nicht serialisierbar]"}}
 LOGS.push(e);
 if(LOGS.length>600)LOGS.splice(0,LOGS.length-600);
 logSave();
 if(level=="err")console.warn("[fitplan] "+area+": "+msg,e.d||"");
 return e;
}

function logFile(){
 const L=[];
 L.push("GainPilot – Diagnosebericht");
 L.push("Erstellt: "+new Date().toISOString());
 L.push("App-Version: "+PUBLIC_V);
 L.push("Benutzeragent: "+navigator.userAgent);
 L.push("Sprache: "+navigator.language+" | Online: "+navigator.onLine);
 L.push("Fenster: "+window.innerWidth+"x"+window.innerHeight+" | Pixelverhältnis: "+window.devicePixelRatio);
 L.push("Standort: "+location.href.replace(/[?#].*$/,""));
 L.push("Speicher: "+(function(){try{return localStorage.getItem("fitplan")?"vorhanden, "+localStorage.getItem("fitplan").length+" Zeichen":"leer"}catch(e){return "nicht lesbar: "+e.message}})());
 L.push("API-Schlüssel: "+(S.key?"eingetragen, "+S.key.length+" Zeichen, beginnt mit "+S.key.slice(0,4):"FEHLT"));
 L.push("Modell gespeichert: "+(S.fast||S.model||"(leer)"));
 L.push("Lebensmittel: "+FOODS.length+" | Gerichte: "+MEALS.length+" | eigene: "+S.custom.length+" | Rezepte: "+Object.keys(RECIPES).length);
 L.push("Plan: "+Object.keys(S.plan||{}).length+" Felder, "+entries(0).length+"/"+entries(3).length+" Einträge (Tag 0/3) | Protokolltage: "+Object.keys(S.log||{}).length);
 L.push("Letzter Fehler: "+(LASTERR||"keiner"));
 L.push("");
 L.push("--- Protokoll (neueste zuerst) ---");
 LOGS.slice().reverse().forEach(e=>{L.push(e.t+" ["+e.lv+"] "+e.a+": "+e.m+(e.d?" | "+e.d:""))});
 return L.join("\n");
}
function logDownload(){
 const txt=logFile(),name="fitplan-log-"+new Date().toISOString().slice(0,19).replace(/[:T]/g,"-")+".txt";
 try{
  dateiTeilen(name,txt,"text/plain;charset=utf-8").then(()=>logInfo("log","Protokolldatei erstellt: "+name))
   .catch(e=>{if(e&&(e.name=="AbortError"||/cancel/i.test(e.message||"")))return;toast("Speichern nicht möglich. Nutze „Diagnoseprotokoll anzeigen“ und kopiere den Text.");logErr("log","Download fehlgeschlagen: "+e.message);});
 }catch(e){logErr("log","Download fehlgeschlagen: "+e.message);}
}
function logCopy(){
 const txt=logFile();
 if(navigator.clipboard&&navigator.clipboard.writeText){
  navigator.clipboard.writeText(txt).then(()=>{logInfo("log","Protokoll in die Zwischenablage kopiert");toast("Protokoll kopiert ("+txt.length+" Zeichen). Es kann jetzt eingefügt und gesendet werden.");},
   e=>{logErr("log","Kopieren abgelehnt: "+e.message);logShow();});
 }else{logShow();}
}
function logShow(){
 const txt=logFile();
 sheet(`<b>Diagnoseprotokoll</b><small style="display:block;color:var(--mut);margin:4px 0 8px">${txt.length} Zeichen · ${LOGS.length} Einträge</small>
 <textarea class="n" id="ltxt" rows="14" readonly>${esc(txt)}</textarea>
 <button class="btn" onclick="logCopy()">Kopieren</button><button class="btn" onclick="logDownload()">Als Datei speichern</button>
 <button class="btn g" onclick="logClear()">Protokoll löschen</button><button class="btn g" onclick="closeSheet()">Schließen</button>`);
}
function logClear(){if(!confirm("Diagnoseprotokoll löschen?"))return;LOGS=[];logSave();logInfo("log","Protokoll geleert");closeSheet();toast("Protokoll geleert.");}

async function neuLaden(){
 try{
  if("serviceWorker" in navigator){
   const regs=await navigator.serviceWorker.getRegistrations();
   for(const r of regs){try{await r.unregister()}catch(e){}}
  }
  if(window.caches){const ks=await caches.keys();for(const k of ks){try{await caches.delete(k)}catch(e){}}}
 }catch(e){}
 location.reload(true);
}

en.\nSüßkartoffeln würfeln, mit Salz und Gewürzen auf ein Blech geben und 25 Min. backen.\nLachs salzen und nach 10 Min. mit aufs Blech legen (ca. 12–15 Min. garen).\nBrokkoli 5 Min. dämpfen und alles zusammen anrichten.", "10": "Reis nach Packungsangabe kochen.\nHähnchenbrust in dünne Streifen schneiden und in Öl im Wok bei hoher Hitze 5 Min. braten.\nTK-Wokgemüse dazugeben und 5 Min. mitbraten.\nMit Sojasauce ablöschen und mit dem Reis servieren.", "11": "Eier mit Salz und Pfeffer verquirlen.\nPaprika würfeln und 3 Min. in einer beschichteten Pfanne anbraten.\nEiermasse darübergießen und bei niedriger Hitze stocken lassen, zusammenklappen.\nMit Hüttenkäse und Vollkornbrot servieren.", "12": "Reis nach Packungsangabe kochen.\nPutenhack in einem Topf krümelig anbraten, Paprika würfeln und mitbraten.\nPassierte Tomaten und abgespülte Kidneybohnen dazugeben, mit Chili, Kreuzkümmel, Salz würzen.\n15 Min. köcheln lassen und auf dem Reis servieren.", "13": "Magerquark in eine Schüssel geben, Beeren auftauen und unterrühren.", "14": "Whey-Protein mit der kalten Milch in einem Shaker oder Mixer 20 Sek. schütteln bzw. mixen.", "15": "Apfel waschen, in Spalten schneiden und mit den Mandeln essen.", "16": "Gurke in Scheiben schneiden, Hüttenkäse dazugeben, mit Pfeffer und Salz würzen.", "17": "Eier 8–10 Min. hart kochen, abschrecken und pellen.\nMöhren schälen und in Sticks schneiden, dazu essen.", "18": "Haferflocken, Skyr und Chiasamen im Glas oder in einer Dose verrühren, nach Wunsch mit einem Schuss Wasser geschmeidiger machen.\nAbgedeckt mindestens 4 Stunden, am besten über Nacht, in den Kühlschrank stellen.\nMorgens umrühren und mit den aufgetauten Beeren toppen.", "19": "Eier 8 Min. hart kochen, abschrecken und pellen, oder als Spiegelei braten.\nAvocado halbieren, entkernen, das Fruchtfleisch mit einer Gabel zerdrücken und mit Salz, Pfeffer und etwas Zitronensaft abschmecken.\nBrot nach Wunsch toasten, die Avocadocreme daraufstreichen.\nTomaten in Scheiben schneiden, mit den in Scheiben geschnittenen Eiern darauf legen.", "20": "Magerquark in eine Schüssel geben und glatt rühren.\nApfel waschen, entkernen und in kleine Würfel schneiden oder grob reiben.\nApfel mit Zimt unter den Quark mischen.\nWalnüsse grob hacken und darüberstreuen.", "21": "Brot nach Wunsch toasten.\nGurke in Scheiben schneiden.\nHüttenkäse auf dem Brot verteilen und mit Gurke belegen.\nMit Olivenöl beträufeln, salzen und pfeffern.", "22": "Banane in Stücke brechen und mit Milch, Whey-Protein und Haferflocken in einen Mixer geben.\nEtwa 30 Sekunden cremig mixen.\nSofort trinken, da der Shake mit der Zeit andickt.", "23": "Spinat waschen und in einer beschichteten Pfanne ohne Fett 1–2 Min. zusammenfallen lassen.\nEier mit Salz und Pfeffer verquirlen, über den Spinat gießen und unter Rühren bei mittlerer Hitze 2–3 Min. stocken lassen.\nFeta darüberbröseln und kurz untermischen.\nMit dem Brot servieren.", "24": "Joghurt in eine Schale geben.\nBeeren auftauen oder waschen und darauf verteilen.\nMandeln grob hacken und darüberstreuen.", "25": "Reis nach Packungsangabe kochen.\nHähnchenbrust in Streifen schneiden, mit Salz, Pfeffer, Paprikapulver und Kreuzkümmel würzen und in einer Pfanne 6–8 Min. durchbraten.\nKidneybohnen abspülen und kurz erwärmen, Paprika würfeln.\nAvocado in Scheiben schneiden.\nReis in eine Schüssel geben und mit Hähnchen, Bohnen, Paprika und Avocado belegen.", "26": "Frischkäse auf dem Vollkornbrot (oder einem Vollkorn-Wrap) verstreichen.\nMit Putenbrust und Salat belegen, mit Pfeffer würzen.\nZusammenrollen oder zusammenklappen und schräg halbieren.", "27": "Nudeln nach Packungsangabe bissfest kochen, abgießen.\nRote Linsen mit Olivenöl in einem Topf kurz anschwitzen, passierte Tomaten und etwa 150 ml Wasser zugeben.\nMit Salz, Pfeffer, Oregano und Knoblauch würzen und 12–15 Min. köcheln lassen, bis die Linsen zerfallen und die Sauce dick ist.\nSauce über die Nudeln geben.", "28": "Reis nach Packungsangabe kochen.\nKichererbsen abspülen und mit Kokosmilch und etwa 50 ml Wasser in einem Topf aufkochen.\nMit Currypulver, Kurkuma, Salz und Pfeffer würzen und 8 Min. köcheln lassen.\nSpinat zugeben und 2 Min. zusammenfallen lassen.\nMit dem Reis servieren.", "29": "Süßkartoffeln schälen, würfeln und in Salzwasser 15 Min. weich kochen.\nBrokkoli in Röschen teilen und 5 Min. mitgaren oder dämpfen.\nPutenbrust in Streifen schneiden, salzen und pfeffern und in einer Pfanne mit Olivenöl 6–8 Min. braten.\nSüßkartoffeln abgießen und mit einer Gabel oder einem Stampfer zu Püree zerdrücken, mit Salz und Muskat abschmecken.\nAlles zusammen anrichten.", "30": "Quinoa nach Packungsangabe kochen, falls sie nicht schon fertig ist.\nTofu abtropfen lassen, würfeln und in einer beschichteten Pfanne ohne Fett 6–8 Min. goldbraun braten, mit Sojasauce oder Gewürzen abschmecken.\nPaprika würfeln, Avocado in Scheiben schneiden.\nQuinoa in eine Schüssel geben und mit Tofu, Paprika und Avocado belegen.", "31": "Reis nach Packungsangabe kochen.\nRinderhack in einer Pfanne ohne zusätzliches Fett krümelig anbraten und mit Salz, Pfeffer, Paprikapulver und Kreuzkümmel würzen.\nKidneybohnen abspülen, mit dem Mais zum Hack geben und 3–4 Min. mit erwärmen.\nAuf dem Reis servieren.", "32": "Basmatireis nach Packungsangabe kochen, falls er nicht schon gekocht ist.\nGemüsepfanne in einem Topf oder einer Pfanne 5 Min. anbraten, Currypulver zugeben und kurz mitrösten.\nKokosmilch angießen und 5 Min. köcheln lassen.\nForelle salzen, in Stücke teilen, in die Sauce legen und 5–6 Min. bei kleiner Hitze gar ziehen lassen.\nMit dem Reis servieren.", "33": "Kartoffeln in Scheiben schneiden, Zwiebel würfeln.\nOlivenöl in einer Pfanne erhitzen und die Kartoffeln 8–10 Min. goldbraun braten.\nZwiebel dazugeben und 3 Min. mitbraten, mit Salz, Pfeffer und Paprikapulver würzen.\nHüttenkäse kalt dazu essen oder kurz untermischen.", "34": "Hähnchenbrust in Streifen schneiden, würzen und in einer Pfanne 6–8 Min. durchbraten, abkühlen lassen.\nTomaten und Gurke in grobe Stücke schneiden.\nAlles mit Olivenöl, Zitronensaft oder Essig, Oregano, Salz und Pfeffer vermengen.\nFeta darüberbröseln.", "35": "Zucchini mit einem Spiralschneider zu Nudeln schneiden, alternativ mit einem Sparschäler in lange Streifen hobeln.\nPassierte Tomaten in einer Pfanne mit Salz, Pfeffer und Oregano 5 Min. einkochen lassen.\nHähnchen in Streifen schneiden und in der Sauce erwärmen.\nZucchini-Nudeln 2–3 Min. in der Sauce ziehen lassen, damit sie bissfest bleiben.\nMit Parmesan bestreuen.", "36": "Ofen auf 200 °C vorheizen.\nKartoffeln würfeln, mit der Gemüsepfanne und Olivenöl mischen, salzen und pfeffern.\nAuf einem Blech 25–30 Min. backen, dabei einmal wenden.\nFeta darübergeben und weitere 5 Min. backen.", "37": "Reis nach Packungsangabe kochen.\nWokgemüse in einer heißen Pfanne oder im Wok 5 Min. anbraten.\nGarnelen dazugeben und 3–4 Min. braten, bis sie rosa sind.\nMit Sojasauce ablöschen und mit dem Reis servieren.", "38": "Reis nach Packungsangabe kochen.\nTofu abtropfen lassen, würfeln und in einer beschichteten Pfanne 6–8 Min. knusprig braten.\nGemüsepfanne dazugeben und 5 Min. mitbraten.\nMit Sojasauce würzen und auf dem Reis servieren.", "39": "Putenhack mit Salz, Pfeffer und etwas Oregano verkneten und zu kleinen Bällchen formen.\nBällchen in einer beschichteten Pfanne rundum 5 Min. anbraten.\nPassierte Tomaten angießen und 10 Min. köcheln lassen.\nNudeln nach Packungsangabe kochen und mit den Bällchen anrichten, mit Parmesan bestreuen.", "40": "Süßkartoffeln würfeln, mit etwas Olivenöl, Salz und Pfeffer auf einem Blech bei 200 °C 20–25 Min. rösten.\nLachs salzen, pfeffern und in der Pfanne 3–4 Min. pro Seite braten.\nSalat waschen und auf einem Teller anrichten.\nSüßkartoffeln und Lachs darauf verteilen, mit dem restlichen Öl und Zitronensaft beträufeln.", "41": "Reis nach Packungsangabe kochen.\nPaprika würfeln und in einem Topf 3 Min. anbraten.\nPassierte Tomaten und abgespülte Kidneybohnen zugeben, mit Chili, Kreuzkümmel, Paprikapulver, Salz und Pfeffer würzen.\n15 Min. köcheln lassen und auf dem Reis servieren.", "42": "Blumenkohl fein reiben oder im Mixer zu reisgroßen Stücken zerkleinern.\nHähnchenbrust würfeln und in Olivenöl 6–8 Min. anbraten.\nCurrypulver zugeben, kurz mitrösten und mit der Kokosmilch ablöschen. 5 Min. köcheln lassen.\nBlumenkohlreis in einer Pfanne 4–5 Min. bissfest garen, mit Salz würzen.\nCurry auf dem Blumenkohlreis servieren.", "43": "Skyr in eine Schüssel geben.\nSchokolade fein hacken oder raspeln.\nHaferflocken und Schokolade unterrühren, nach Wunsch mit etwas Kakao bestäuben.", "44": "Tomaten waschen und in Stücke schneiden.\nMit dem Hüttenkäse mischen und mit Salz, Pfeffer und Kräutern abschmecken.", "45": "Riegel auspacken und essen. Am besten nach dem Training oder als Snack zwischendurch.", "46": "Banane schälen und in Scheiben schneiden.\nErdnussbutter darüberstreichen oder dazu essen.", "47": "Karotten schälen und in Sticks schneiden, Gurke ebenfalls in Sticks schneiden.\nHummus in ein Schälchen geben und die Gemüsesticks dazu essen.", "48": "Erdbeeren waschen, putzen und in Stücke schneiden.\nMit dem Magerquark verrühren, nach Wunsch mit Zimt oder Süßstoff abschmecken.", "49": "Mandeln, Walnüsse und Cashews mischen.\nIn einer Dose aufbewahren und portionsweise essen.", "50": "Eier in kochendes Wasser geben und 8–10 Min. hart kochen.\nMit kaltem Wasser abschrecken und pellen.\nMit etwas Salz essen.", "51": "Milch und Whey-Protein in einem Shaker oder Mixer 20 Sekunden schütteln bzw. mixen.\nWer es säuerlich mag, nimmt stattdessen Buttermilch. Das spart etwas Kalorien."};

const pk=(wk,i)=>wk+"|"+i;
function entries(wk,i){const p=pk(wk,i);return SLOTS.flatMap(([s])=>(S.plan[p+s]||[]).map((e,x)=>({s,i:x,e,m:meal(e.id)})).filter(y=>y.m));}
function totals(wk,i){const t={k:0,p:0,h:0,f:0};entries(wk,i).forEach(({e,m})=>["k","p","h","f"].forEach(x=>t[x]+=m[x]*e.q));return t;}
function eaten(d){const t={k:0,p:0,h:0,f:0};(S.log[d]||[]).forEach(e=>["k","p","h","f"].forEach(x=>t[x]+=e[x]));return t;}
function bar(l,v,max,u){const pc=max>0?Math.max(0,Math.min(100,v/max*100)):0;return `${l?`<div class="row"><span>${l}</span><span>${Math.round(v)} / ${Math.round(max)} ${u}</span></div>`:""}<div class="bar"><i class="${v>max*1.05?'over':''}" style="width:${pc}%"></i></div>`;}
function weekBar(){
 const wk=S.wk,heute=todayISO(),aktiv=dISO(wk,S.day)==heute;
 const days=DAYS.map((x,i)=>{const d=dISO(wk,i),has=entries(wk,i).length||((S.log[d]||[]).length);
  return `<button class="${i==S.day?'on':''} ${d==heute?'td':''}" onclick="S.day=${i};S.wkLock=true;save();render()">${DAYS[i]}<small>${+d.slice(8,10)}</small>${has?'<i></i>':''}</button>`;}).join("");
 return `<div class="wkpick"><button class="nav" aria-label="Vorheriger Tag" onclick="dayShift(-1)">‹</button>
 <span>${tagLabel(wk,S.day)}${aktiv?'':'<button class="heute" onclick="goToday()">Heute</button>'}</span>
 <button class="nav" aria-label="Nächster Tag" onclick="dayShift(1)">›</button></div>
 <div class="days">${days}</div>`;}
function tagLabel(wk,i){const d=dateOf(wk,i),h=dISO(wk,i)==todayISO();
 const t=d.toLocaleDateString("de-DE",h?{day:"numeric",month:"long"}:{weekday:"long",day:"numeric",month:"long"});return h?"Heute, "+t:t;}
function wkShift(n){S.wkLock=true;S.wk=iso((()=>{const d=dateOf(S.wk,0);d.setDate(d.getDate()+n*7);return d})());save();render();}
function isThisWeek(){return S.wk==weekOf(0);}
function goToday(){S.wk=weekOf(0);S.day=dayIndex(new Date());save();render();}
function subTabs(list){return `<div class="sub">${list.map(([k,n])=>`<button class="${sub[tab]==k?'on':''}" onclick="sub[tab]='${k}';render()">${n}</button>`).join("")}</div>`;}

function pickerItems(s,fn,q){
 const f=m=>`<div class="opt" onclick="${fn}(${m.id})"><b>${(S.fav||[]).includes(m.id)?"★ ":""}${esc(m.n)}</b>${m.custom?'<span class="tag">eigenes</span>':''}<small>${mac(m)}${m.cat?" · "+esc(m.cat):""}${m.z>1?" · 1 von "+m.z+" Portionen":""}</small></div>`;
 let all=allMeals();const MAXN=60;q=(q||"").toLowerCase().trim();
 if(PF.cat=="fav")all=all.filter(m=>(S.fav||[]).includes(m.id));
 else if(PF.cat=="own")all=all.filter(m=>m.custom);
 else if(PF.cat=="quick")all=all.filter(m=>m.t&&m.t<=15);
 else if(PF.cat=="prot")all=all.filter(m=>m.k>0&&m.p*4/m.k>=0.3).sort((a,b)=>b.p/b.k-a.p/a.k);
 else if(PF.cat)all=all.filter(m=>m.cat==PF.cat);
 if(!all.length)return `<div class="empty">${PF.cat=="fav"?"Noch keine Favoriten. Öffne ein Rezept und tippe auf ★.":PF.cat=="own"?"Noch keine eigenen Gerichte.":"Nichts gefunden."}</div>`;
 if(q){const w=q.split(/\s+/).filter(Boolean);
  const hit=all.filter(m=>w.every(x=>mealText(m).includes(x)));
  if(s)hit.sort((a,b)=>(fitsSlot(b,s)?1:0)-(fitsSlot(a,s)?1:0));
  if(!hit.length)return "<small>Nichts gefunden.</small>";
  return `<small style="display:block;color:var(--mut);margin:6px 0">${hit.length} Treffer${hit.length>MAXN?", die ersten "+MAXN+" werden gezeigt":""}</small>`+hit.slice(0,MAXN).map(f).join("")||"<small>Nichts gefunden.</small>";}
 const fv=m=>(S.fav||[]).includes(m.id)?1:0;
 const pass=(s?all.filter(m=>fitsSlot(m,s)):all).slice().sort((a,b)=>fv(b)-fv(a));
 return `<small style="display:block;color:var(--mut);margin:6px 0">${s?"Passend zur Mahlzeit":"Gerichte"}: ${pass.length}</small>`+pass.slice(0,MAXN).map(f).join("")+`<small style="display:block;color:var(--mut);margin:8px 0">Mit der Suche findest du alle ${all.length} Gerichte, auch nach Zutat oder Kategorie.</small>`;

/* ---------- FORTSCHRITTSANALYSE ---------- */
const KCAL_PRO_KG=7700; // grobe Näherung für 1 kg Körpergewichtsänderung
function regSteigung(pts){
 const n=pts.length;if(n<2)return null;
 const mx=pts.reduce((a,q)=>a+q.x,0)/n,my=pts.reduce((a,q)=>a+q.y,0)/n;
 let sxy=0,sxx=0;pts.forEach(q=>{sxy+=(q.x-mx)*(q.y-my);sxx+=(q.x-mx)*(q.x-mx);});
 return sxx>0?sxy/sxx:null;
}
function zahl1(x){return (Math.round(x*10)/10).toString().replace(".",",");}
function analyse(tage){
 tage=tage||S.anaTage||14;
 const heute=todayISO(),von=tagMinus(heute,tage-1),R={tage,von,bis:heute};
 // Gewicht
 const alle=Object.keys(S.weight||{}).filter(d=>d<=heute).sort();
 const wk=alle.filter(d=>d>=von);
 R.wN=wk.length;R.wSpanne=wk.length>1?tageZw(wk[0],wk[wk.length-1]):0;
 R.wOk=R.wN>=4&&R.wSpanne>=Math.round(tage*0.6);
 R.aktuell=alle.length?wTrend(alle,S.weight,alle[alle.length-1]):null;
 if(R.wOk){const st=regSteigung(wk.map(d=>({x:tageZw(von,d),y:+S.weight[d]})));R.proTag=st;R.proWoche=st*7;}
 // Ernährung: nur Tage mit einigermaßen vollständigem Protokoll
 const tg=[];for(let i=0;i<tage;i++){const d=tagMinus(heute,i),e=eaten(d);if(e.k>=Math.max(800,0.4*(S.kcal||2000)))tg.push(e);}
 R.eN=tg.length;R.eOk=R.eN>=Math.min(5,Math.round(tage*0.4));
 if(tg.length){const m=k=>tg.reduce((a,e)=>a+e[k],0)/tg.length;R.k=m("k");R.p=m("p");R.h=m("h");R.f=m("f");}
 // geschätzter tatsächlicher Bedarf
 if(R.wOk&&R.eOk)R.bedarf=Math.round((R.k-R.proTag*KCAL_PRO_KG)/10)*10;
 // Ziel und Bewertung
 const gw=+S.wGoal||0;
 if(gw&&R.aktuell){const diff=gw-R.aktuell;R.richtung=diff<-0.5?"ab":(diff>0.5?"auf":"halten");}
 if(R.richtung&&R.aktuell){
  const bw=R.aktuell,pc=x=>bw*x/100;
  R.band=R.richtung=="ab"?[-pc(0.75),-pc(0.25)]:(R.richtung=="auf"?[pc(0.1),pc(0.35)]:[-pc(0.2),pc(0.2)]);
  R.zielRate=(R.band[0]+R.band[1])/2;
  if(R.wOk){const r=R.proWoche;
   R.status=r<R.band[0]?"zu schnell runter":(r>R.band[1]?"zu schnell rauf":"im Zielbereich");
   if(R.richtung=="ab"&&r>R.band[1])R.status=r>pc(0.1)?"falsche Richtung":"zu langsam";
   if(R.richtung=="auf"&&r<R.band[0])R.status=r<-pc(0.1)?"falsche Richtung":"zu langsam";
   if(R.richtung=="halten")R.status=r<R.band[0]?"nimmt ab":(r>R.band[1]?"nimmt zu":"im Zielbereich");
  }
 }
 // Empfehlung
 R.empf={art:"keine",text:""};
 if(!R.wOk)R.empf.text="Für eine Auswertung fehlen Gewichtswerte: Trage in "+tage+" Tagen mindestens 4 Messungen ein, verteilt über mehr als "+Math.round(tage*0.6)+" Tage. Du hast "+R.wN+".";
 else if(!R.richtung)R.empf.text="Setze ein Zielgewicht (Fortschritt → Gewicht), dann kann ich bewerten, ob dein Tempo passt.";
 else if(!R.eOk)R.empf.text="Für eine Kalorien-Empfehlung fehlen Essensprotokolle: Du hast "+R.eN+" ausreichend vollständige Tage, nötig sind mindestens "+Math.min(5,Math.round(tage*0.4))+". Der Gewichtstrend allein reicht dafür nicht.";
 else if(R.status=="im Zielbereich"){R.empf={art:"halten",text:"Dein Tempo passt zu deinem Ziel. Bleib bei deinem Kalorienziel und prüfe in ein bis zwei Wochen erneut."};}
 else{
  const ziel=S.kcal||2000,abw=R.k/ziel-1;
  const braucht_mehr=(R.status=="zu langsam"||R.status=="falsche Richtung")?(R.richtung=="auf"):(R.status=="zu schnell rauf"||R.status=="nimmt zu"?false:(R.status=="zu schnell runter"||R.status=="nimmt ab"));
  const zuViel=(R.status=="zu langsam"||R.status=="falsche Richtung")?(R.richtung=="ab"):(R.status=="zu schnell rauf"||R.status=="nimmt zu");
  if(zuViel&&abw>0.1)R.empf={art:"einhalten",text:"Du isst im Schnitt "+Math.round(R.k)+" kcal und damit "+Math.round(abw*100)+" % über deinem Ziel von "+ziel+" kcal. Halte zuerst das Ziel ein, bevor du es änderst."};
  else if(braucht_mehr&&abw<-0.1)R.empf={art:"einhalten",text:"Du isst im Schnitt "+Math.round(R.k)+" kcal und damit "+Math.round(-abw*100)+" % unter deinem Ziel von "+ziel+" kcal. Komm zuerst auf dein Ziel, bevor du es änderst."};
  else{
   const soll=R.bedarf+R.zielRate*KCAL_PRO_KG/7;
   let delta=Math.max(-300,Math.min(300,soll-ziel)),neu=Math.round((ziel+delta)/50)*50;
   if(Math.abs(neu-ziel)<100)R.empf={art:"halten",text:"Dein Tempo weicht leicht ab, die nötige Änderung ist aber klein (unter 100 kcal). Bleib beim Ziel und prüfe in ein bis zwei Wochen erneut."};
   else if(neu<1400)R.empf={art:"keine",text:"Rechnerisch würde das Ziel unter 1.400 kcal fallen. Dazu gebe ich keinen Vorschlag. Prüfe Zielgewicht und Zeitplan, bei Bedarf mit ärztlichem Rat."};

 }
 // Eiweiß
 if(R.eOk&&S.prot){R.protQuote=R.p/S.prot;}
 // Training
 const geplant=[],fertig=[];
 Object.keys(S.train||{}).forEach(k=>{const [w,i]=k.split("|");if(!(S.train[k]||[]).length)return;const d=dISO(w,+i);
  if(d<von||d>heute)return;geplant.push(d);if((S.train[k]||[]).some(n=>echteEinheit(d,n)))fertig.push(d);});

 const vol=(a,b)=>{let v=0;Object.keys(S.sets||{}).forEach(d=>{if(d<a||d>b)return;Object.keys(S.sets[d]).forEach(n=>{if(!echteEinheit(d,n))return;S.sets[d][n].forEach(x=>{v+=(+x.kg||0)*(+x.reps||0);});});});return Math.round(v);};

 const pr=[];const namen=new Set();
 Object.keys(S.sets||{}).forEach(d=>{if(d<von||d>heute)return;Object.keys(S.sets[d]).forEach(n=>{if(echteEinheit(d,n))namen.add(n);});});
 namen.forEach(n=>{let best=0;Object.keys(S.sets).forEach(d=>{if(d<von||d>heute||!echteEinheit(d,n)||!S.sets[d][n])return;S.sets[d][n].forEach(x=>{best=Math.max(best,e1rm(x.kg,x.reps));});});
  const vor=bestesE1(n,von);if(vor>0&&best>vor+0.05)pr.push(n);});
 R.rekorde=pr;
 return R;
}

  const r=await BS.scan({formats:["EAN_13","EAN_8","UPC_A","UPC_E"]});const c=r&&r.barcodes&&r.barcodes[0]&&(r.barcodes[0].rawValue||r.barcodes[0].displayValue);

 }catch(e){bcMsg(e&&e.name=="AbortError"?"Zeitüberschreitung. Prüfe deine Verbindung und versuche es noch einmal.":"Suche fehlgeschlagen: "+(e&&e.message||e));try{logWarn("barcode","Suche fehlgeschlagen: "+(e&&e.message));}catch(_){}}
}

const modelsTriedBad=new Set();
async function askAI(model,prompt,tokens,noThink){
 const IMG_TIMEOUT=10000;     // einzelner Bildaufruf
 const TOTAL_BUDGET=45000;    // gesamte Analyse, inklusive Wartezeiten
 const OVERLOAD_BUDGET=26000; // bei Überlastung: längeres Budget
 const call=async(url,body,ms)=>{const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),ms||IMG_TIMEOUT);
  try{const r=await fetch(url,{method:"POST",signal:ctl.signal,headers:{"Content-Type":"application/json","x-goog-api-key":S.key},body:JSON.stringify(body)});
   return {r,j:await r.json()};}
  catch(e){return {r:{ok:false,status:0},j:{error:{message:e.name=="AbortError"?"Zeitlimit nach "+(Math.round((ms||IMG_TIMEOUT)/1000))+" s":e.message}}};}
  finally{clearTimeout(to);}};
 const wait=ms=>new Promise(r=>setTimeout(r,ms));
 const urlFor=mm=>"https://generativelanguage.googleapis.com/v1beta/models/"+encodeURIComponent(mm)+":generateContent";
 let last="unbekannt",ueberlastet=false;
 const t0=performance.now();
 const order=[];
 if(model)order.push(model);
 if(S.fast&&!order.includes(S.fast))order.push(S.fast);
 if(S.model&&!order.includes(S.model))order.push(S.model);
 ["gemini-3.5-flash-lite",DEFAULT_MODEL].forEach(m=>{if(!order.includes(m))order.push(m)});
 (LIST||[]).filter(x=>typeof x=="string").slice(0,4).forEach(m=>{if(!order.includes(m))order.push(m)});
 const models=order.filter(m=>!modelsTriedBad.has(m)).slice(0,2);
 let aufrufe=0;const MAX_AUFRUFE=8;
 // Runde 0: volles Bild. Runde 1: verkleinert. Runde 2: stark verkleinert.
 const stufen=[0,Math.min(S.imgPx||640,560),400];
 const gesehen=new Set();
 for(let runde=0;runde<stufen.length;runde++){
  if(performance.now()-t0>(ueberlastet?OVERLOAD_BUDGET:TOTAL_BUDGET)){logWarn("api","Zeitbudget erreicht");break;}
  const b64=runde==0?photoB64:await cropB64(stufen[runde]);
  if(!b64||gesehen.has(b64.length))continue;
  gesehen.add(b64.length);
  if(runde>0)logInfo("api","weiterer Versuch mit kleinerem Bild",{stufe:stufen[runde],groesse:b64.length});
  for(const m of models){
   // Versuche je Modell: 1 normal, bei Überlastung bis zu 2 Wiederholungen mit Pause
   let versuch=0,wiederholungen=0;
   while(versuch<3){
    versuch++;
    if(aufrufe>=MAX_AUFRUFE){
     logWarn("api","Obergrenze an Serveraufrufen erreicht",{max:MAX_AUFRUFE});
     const art=ueberlastet?"ueberlastet":"zeit";
     return {ok:false,error:last,art,
      text:ueberlastet?"Der Dienst von Google ist gerade ausgelastet. Das ist vorübergehend. Versuche es in ein paar Minuten erneut oder nutze die Datenbank.":null};
    }
    aufrufe++;
    if(performance.now()-t0>(ueberlastet?OVERLOAD_BUDGET:TOTAL_BUDGET))break;
    const body={contents:[{parts:[{text:prompt},{inline_data:{mime_type:"image/jpeg",data:b64}}]}],
      generationConfig:{responseMimeType:"application/json",temperature:0,maxOutputTokens:tokens}};
    const tag=(runde?("bild"+stufen[runde]+"/"):"")+m+(wiederholungen?"/wiederholung"+wiederholungen:"");
    const t1=performance.now();
    const {r,j}=await call(urlFor(m),body,IMG_TIMEOUT);
    const ms=Math.round(performance.now()-t1);
    if(r.ok){
     const t=(j.candidates?.[0]?.content?.parts||[]).map(p=>p.text||"").join("");
     logInfo("api","Bildaufruf erfolgreich",{versuch:tag,status:r.status,dauer:ms,laenge:t.length});
     if(t)return {ok:true,text:t,how:tag};
     logWarn("api","Bildaufruf ohne Text",{versuch:tag,finishReason:j.candidates?.[0]?.finishReason});
     last=tag+": leere Antwort";break;
    }
    const msg=j.error?.message||("HTTP "+r.status);
    last=tag+": "+msg;
    logErr("api","Bildaufruf fehlgeschlagen",{versuch:tag,status:r.status,dauer:ms,fehler:msg});
    setLastErr(last);
    if(/not found|no longer available|not supported|deprecated|404|not exist/i.test(msg)){modelsTriedBad.add(m);break;}
    if(/API key|PERMISSION|billing|invalid.*key/i.test(msg))return {ok:false,error:msg,art:"schluessel"};
    if(r.status==503||r.status==429||/high demand|overload|unavailable|try again later|quota|rate limit/i.test(msg)){
     ueberlastet=true;
     if(wiederholungen<2){
      wiederholungen++;
      const pause=2000*wiederholungen;
      logWarn("api","Server überlastet, warte "+pause/1000+" s und versuche es erneut",{versuch:tag,status:r.status});
      const el=document.getElementById("pres");
      if(el)el.innerHTML=`<div class="spin">Der Dienst ist gerade ausgelastet. Warte ${pause/1000} Sekunden und versuche es erneut …</div>`;
      await wait(pause);
      continue;
     }
     break;
    }
    if(/Zeitlimit/i.test(msg))break; // dieses Bild war zu groß, kleiner versuchen
    break;
   }
  }
 }
 if(ueberlastet){
  logErr("api","Bildanalyse abgebrochen: Dienst überlastet");
  const hinweis="Der Dienst von Google ist gerade ausgelastet. Das ist vorübergehend. Versuche es in ein paar Minuten erneut oder nutze die Datenbank.";
  setLastErr("Bildanalyse: Dienst überlastet");

 }
 logErr("api","Bildanalyse endgültig fehlgeschlagen",{fehler:last});
 setLastErr("Bildanalyse: "+last);
 return {ok:false,error:last,art:"zeit"};
}

function findFood(n){n=(n||"").toLowerCase().trim();if(!n)return null;
 const ex=FOODS.find(f=>f.n.toLowerCase()==n);if(ex)return ex;
 const w=n.split(/\s+/).filter(Boolean);
 const score=f=>{const t=f.n.toLowerCase(),base=t.split(" (")[0];
  if(t===n||base===n)return 0;
  if(base.startsWith(n)||t.startsWith(n))return 1;
  if(n.includes(base))return 2;
  if(w.every(x=>base.split(" ").some(b=>b.startsWith(x))))return 3;
  if(w.every(x=>t.includes(x)))return 4;
  return 9;};
 const hits=FOODS.filter(f=>score(f)<9).sort((a,b)=>score(a)-score(b)||a.n.length-b.n.length);
 return hits[0]||null;}

const RX_FLEISCH=/(hähnchen|pute|rind|schwein|lachs|forelle|kabeljau|thunfisch|garnele|schinken|hack|gulasch|speck|fisch)/i;
const RX_TIER=/^(milch|butter|ei\b|eier|eiklar|honig|gelatine|whey)|joghurt|skyr|quark|käse|feta|parmesan|mozzarella|ricotta/i;
function ernaehrungsform(m){ // 0 = mit Fleisch/Fisch, 1 = vegetarisch, 2 = vegan
 const z=(m.i||[]).map(x=>String(x[0]).replace(/gehackt\w*/gi,""));
 if(z.some(n=>RX_FLEISCH.test(n)))return 0;
 if(z.some(n=>RX_TIER.test(n)))return 1;
 return 2;
}
function vf(){S.vf=S.vf||{diet:"alle",maxT:0};return S.vf;}
function eignetFuerVorschlag(m){
 if(!m||!(m.k>0)||!m.i||!m.i.length)return false;
 if((S.ban||[]).includes(m.id))return false;
 const f=vf(),form=ernaehrungsform(m);
 if(f.diet=="veg"&&form<1)return false;
 if(f.diet=="vegan"&&form<2)return false;
 if(f.maxT&&m.t&&m.t>f.maxT)return false;
 return true;
}
function zufall(n){return Math.floor(Math.random()*n);}
function mische(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=zufall(i+1);const t=b[i];b[i]=b[j];b[j]=t;}return b;}
// Bewertung eines Tages: Abstand zu Kalorien- und Eiweißziel, Eiweiß-Unterschreitung zählt mehr
function tagFehler(ids,q,ziel,prot){
 let k=0,pr=0,h=0,f=0;ids.forEach(m=>{k+=m.k*q;pr+=m.p*q;h+=(m.h||0)*q;f+=(m.f||0)*q;});
 let e=Math.abs(k-ziel)/ziel*2+Math.max(0,prot-pr)/Math.max(1,prot)*1.6+Math.abs(pr-prot)/Math.max(1,prot)*0.3;
 if(S.kh>0)e+=Math.abs(h-S.kh)/S.kh*0.8;
 if(S.fett>0)e+=Math.abs(f-S.fett)/S.fett*0.8;
 return e;
}
function bestQ(ids,ziel,prot){
 let best=1,bf=1e9;
 for(let q=0.5;q<=3.001;q+=0.25){const e=tagFehler(ids,q,ziel,prot);if(e<bf){bf=e;best=q;}}
 return {q:best,e:bf};
}
function vorschlagWoche(streng){
 const ziel=Math.max(1200,S.kcal||2000),prot=Math.max(30,S.prot||ziel*0.075);
 const alle=MEALS.concat(S.custom||[]).filter(eignetFuerVorschlag);
 if(alle.length<8){toast("Mit diesen Filtern bleiben zu wenige Gerichte übrig ("+alle.length+"). Lockere die Filter oder leere die Sperrliste.");return;}
 const slots=[["f",0.25],["m",0.35],["a",0.30],["s",0.10]];
 const pools={};slots.forEach(([sl])=>{pools[sl]=alle.filter(m=>fitsSlot(m.c?m:Object.assign({},m,{c:"m"}),sl));});
 const zaehler={},gewaehlt={},fav=S.fav||[];
 const strafe=m=>(zaehler[m.id]||0)*(streng?0.35:0.18)-(fav.includes(m.id)?0.12:0);
 for(let d=0;d<7;d++){
  let bestTag=null,bestE=1e9;
  for(let versuch=0;versuch<140;versuch++){
   const tag={},ids=[];
   slots.forEach(([sl,anteil])=>{
    const pool=pools[sl];if(!pool.length)return;
    // Kandidat mit passender Größe bevorzugen, aber zufällig bleiben
    let wahl=null,ws=1e9;
    for(let i=0;i<6;i++){const m=pool[zufall(pool.length)];if(ids.includes(m))continue;
     const s=Math.abs(m.k-ziel*anteil)/(ziel*anteil)-m.p/Math.max(1,m.k)*2+strafe(m)+Math.random()*0.15;
     if(s<ws){ws=s;wahl=m;}}
    if(wahl&&!ids.includes(wahl)){tag[sl]=wahl;ids.push(wahl);}
   });
   if(!ids.length)continue;
   const {q,e}=bestQ(ids,ziel,prot);
   const gesamt=e+ids.reduce((a,m)=>a+strafe(m),0)*0.15;
   if(gesamt<bestE){bestE=gesamt;bestTag={tag,ids,q};}
  }
  if(!bestTag)continue;
  bestTag.ids.forEach(m=>{zaehler[m.id]=(zaehler[m.id]||0)+1;});
  gewaehlt[d]=bestTag;
 }
 return {gewaehlt};
}

  kSum+=k;pSum+=p;hSum+=hh;fSum+=ff;
  txt+="▪ "+DAYS[d]+": "+SLOTS.filter(([s])=>tag[s]).map(([s,n])=>n+": "+tag[s].n).join(" · ")+(q!=1?" (je "+q+"×)":"")+"\n   "+Math.round(k)+" kcal · "+Math.round(p)+" g Eiweiß\n";
 }
 txt+="\nDurchschnitt: "+Math.round(kSum/7)+" kcal · "+Math.round(pSum/7)+" g Eiweiß · "+Math.round(hSum/7)+" g KH · "+Math.round(fSum/7)+" g Fett\n";
 txt+="Ziel: "+S.kcal+" kcal · "+S.prot+" g Eiweiß"+(S.kh?" · "+S.kh+" g KH":"")+(S.fett?" · "+S.fett+" g Fett":"");
 if(!confirm(txt+"\n\nAls Wochenplan übernehmen? Vorhandener Plan dieser Woche wird ersetzt."))return;
 const wk=S.wk;
 for(let d=0;d<7;d++){SLOTS.forEach(([s])=>delete S.plan[pk(wk,d)+s]);}
 for(let d=0;d<7;d++){if(!v.gewaehlt[d])continue;const {tag,q}=v.gewaehlt[d];
  Object.keys(tag).forEach(sl=>{(S.plan[pk(wk,d)+sl]=S.plan[pk(wk,d)+sl]||[]).push({id:tag[sl].id,q});});}
 Object.keys(S.done||{}).forEach(k=>{if(k.startsWith(wk))delete S.done[k];});save();
 logInfo("plan","Wochenvorschlag übernommen",{woche:wk,kcal:Math.round(kSum/7),protein:Math.round(pSum/7)});
 toast("Vorschlag übernommen. Du kannst jedes Gericht einzeln ändern.");render();
}

function planWeek(wk,still){
 const tage=trDays().slice(),ein=einheiten();
 for(let i=0;i<7;i++){
  const key=wk+"|"+i;
  if(!tage.includes(i)){S.train[key]=[];continue;}
  const nr=tage.indexOf(i);
  const e=ein[nr%ein.length];
  if(!e)continue;
  if(!still&&(S.train[key]||[]).length&&!S.trForce)continue;   // vorhandenes nicht überschreiben
  S.train[key]=e[1].map(x=>x[0]);
  S.trSets=S.trSets||{};
  S.trSets[key]=e[1].map(trSatz);
 }
 S.trPlan=splitName();
 if(!still)logInfo("training","Woche geplant",{woche:wk,vorlage:splitName(),tage:trDays().join(",")});
}

/* ---------- Training: Vorbelegung, Rekorde, Pausentimer ---------- */
const e1rm=(kg,reps)=>{kg=+kg||0;reps=+reps||0;return kg>0&&reps>0?kg*(1+Math.min(reps,30)/30):0;};
function echteEinheit(d,n){ // wurde diese Übung an dem Tag wirklich trainiert (nicht nur geplant)?
 const s=(S.sets[d]&&S.sets[d][n])||[];if(!s.length)return false;
 return !!(S.prDone&&S.prDone[d+"|"+n])||s.some(x=>x.u);
}
function letzteSaetze(n,vorD){ // jüngste echte Einheit vor dem Datum vorD (leichte Deload-Tage nur, wenn es nichts anderes gibt)
 const alle=Object.keys(S.sets||{}).filter(d=>d<vorD&&echteEinheit(d,n)).sort(),normal=alle.filter(d=>!istDeload(d));
 const ds=normal.length?normal:alle;
 if(!ds.length)return null;const d=ds[ds.length-1];return {d,sets:S.sets[d][n]};
}
function bestesE1(n,vorD){let b=0;Object.keys(S.sets||{}).forEach(d=>{if(vorD&&d>=vorD)return;if(!echteEinheit(d,n))return;
 (S.sets[d][n]||[]).forEach(x=>{b=Math.max(b,e1rm(x.kg,x.reps));});});return b;}
function tagVorbereiten(d,key){ // fehlende Sätze aus dem Plan anlegen, Gewichte vom letzten Mal übernehmen
 const plan=(S.trSets&&S.trSets[key])||[];let geaendert=false;
 (S.train[key]||[]).forEach(n=>{
  S.sets[d]=S.sets[d]||{};
  if(!(S.sets[d][n]||[]).length&&!(S.prDone&&S.prDone[d+"|"+n])){
   const pl=plan.find(x=>x.n==n);
   if(pl&&pl.saetze>0){S.sets[d][n]=[];for(let k=0;k<pl.saetze;k++)S.sets[d][n].push({kg:0,reps:repsVon(pl.wieder),pf:1});geaendert=true;}
  }
  const sets=S.sets[d][n]||[];
  if(sets.length&&sets.every(x=>!x.u&&!x.vs&&(!x.kg||x.kg==20||x.pf))&&!(S.prDone&&S.prDone[d+"|"+n])){
   const l=letzteSaetze(n,d),sk=stdKg(n);
   sets.forEach((x,k)=>{const q=l?l.sets[Math.min(k,l.sets.length-1)]:null;const kg=q?(+q.kg||0):sk;
    if(x.kg!=kg){x.kg=kg;x.pf=1;geaendert=true;}});
  }
 });
 if(geaendert)save();
}
/* ---------- Smartes Training: Plateau, Deload-Woche, Pausenlänge ---------- */
const deloads=()=>(S.deloads=S.deloads||[]);
const istDeload=d=>deloads().some(x=>d>=x.von&&d<=x.bis);
const deloadJetzt=()=>deloads().find(x=>todayISO()>=x.von&&todayISO()<=x.bis)||null;
function uebLeistung(n,d){ // bester Wert einer Einheit: geschätztes 1RM, sonst meiste Wdh bzw. längste Haltezeit
 const st=(S.sets[d]&&S.sets[d][n])||[],kg=Math.max(0,...st.map(x=>e1rm(x.kg,x.reps)));
 return kg>0?kg:Math.max(0,...st.map(x=>+x.reps||0));}
function plateau(n,vorD){ // Einheiten seit dem letzten Bestwert (ohne Deload-Tage)
 const ds=Object.keys(S.sets||{}).filter(d=>d<vorD&&echteEinheit(d,n)&&!istDeload(d)).sort();if(ds.length<4)return null;
 let best=0,iBest=0;ds.forEach((d,i)=>{const v=uebLeistung(n,d);if(v>best*1.005){best=v;iBest=i;}});
 const seit=ds.length-1-iBest;if(seit<3)return null;
 const tage=Math.round((new Date(ds[ds.length-1])-new Date(ds[iBest+1]))/864e5);if(tage<10)return null;
 return {seit,best,letzt:ds[ds.length-1]};}
function wochenAmStueck(){ // Wochen in Folge mit mindestens 2 Krafttrainings, seit der letzten Deload-Woche
 const heute=todayISO(),ende=deloads().length?deloads()[deloads().length-1].bis:"";let w=0;
 for(let k=0;k<52;k++){const mo=tagMinus(weekOf(0),7*k);if(ende&&mo<=ende)break;let tage=0;
  for(let t=0;t<7;t++){const d=tagMinus(mo,-t);if(d>heute)break;if(Object.keys((S.sets||{})[d]||{}).some(n=>echteEinheit(d,n)))tage++;}
  if(tage>=2)w++;else if(k>0)break;}
 return w;}
function deloadGrund(){ // null oder Begründung für eine leichtere Woche
 if(deloadJetzt())return null;const heute=todayISO();
 if(S.deloadNein&&tageZw(S.deloadNein,heute)<14)return null;
 const ds=Object.keys(S.sets||{}).filter(d=>d<=heute).sort();if(!ds.length||tageZw(ds[0],heute)<28)return null;
 const w=wochenAmStueck();
 const aktiv=[...new Set(ds.filter(d=>tageZw(d,heute)<=14).flatMap(d=>Object.keys(S.sets[d]).filter(n=>echteEinheit(d,n))))];
 const pl=aktiv.filter(n=>plateau(n,tagMinus(heute,-1)));
 if(pl.length>=2)return {txt:`Bei ${pl.length} Übungen (${pl.slice(0,3).map(n=>{const e=exById(n);return e?e.n:n;}).join(", ")}) gab es seit mehreren Einheiten keinen neuen Bestwert.`};
 if(w>=6)return {txt:`Du trainierst seit ${w} Wochen am Stück. Eine leichtere Woche gibt Muskeln, Sehnen und Gelenken Zeit, sich zu erholen.`};
 return null;}
function deloadKarte(){

 if(j)return `<div class="smk on"><b>🧘 Deload-Woche bis ${fmtDat(j.bis)}</b><small>Etwa 60 % deiner üblichen Gewichte, gleiche Wiederholungen, gern einen Satz weniger. Danach geht es mit den alten Gewichten weiter.</small><button class="btn g" onclick="deloadEnde()">Deload-Woche beenden</button></div>`;
 const g=deloadGrund();if(!g)return "";
 return `<div class="smk"><b>Zeit für eine leichtere Woche?</b><small>${g.txt} Eine Deload-Woche mit etwa 60 % Gewicht hilft oft, danach wieder Fortschritte zu machen.</small><div style="display:flex;gap:8px"><button class="btn" style="flex:1;margin:0" onclick="deloadStart()">Deload-Woche starten</button><button class="btn g" style="flex:1;margin:0" onclick="deloadNein()">Nicht jetzt</button></div></div>`;}
function deloadStart(){const v=todayISO();deloads().push({von:v,bis:tagMinus(v,-6)});save();logInfo("training","Deload-Woche gestartet",{von:v});toast("Deload-Woche gestartet. Die Vorschläge nutzen jetzt leichtere Gewichte.");render();}
function deloadNein(){S.deloadNein=todayISO();save();render();}
function deloadEnde(){const j=deloadJetzt();if(!j)return;j.bis=tagMinus(todayISO(),1);if(j.bis<j.von)S.deloads=deloads().filter(x=>x!==j);save();render();}
function deloadVorschlag(n,d,pi){ // leichte Variante der letzten normalen Einheit
 const lz=letzteSaetze(n,d);if(!lz)return null;const art=uebArt(n),alle=lz.sets.filter(x=>(+x.reps||0)>0);if(!alle.length)return null;
 const kg=Math.max(...alle.map(x=>+x.kg||0)),reps=Math.max(...alle.map(x=>+x.reps));
 if(art=="zeit"||!kg){const r=Math.max(1,Math.round(reps*0.6));return {reps:r,txt:`Deload-Woche: heute nur etwa ${r}${art=="zeit"?" s":" Wdh"} je Satz, ganz locker`};}
 const neu=Math.max(kgSchritt(n,kg),Math.round(kg*0.6/2.5)*2.5),z=zielWdh(pi);
 return {kg:neu,reps:z?z.lo:reps,txt:`Deload-Woche: heute ${kgTxt(neu)} kg statt ${kgTxt(kg)} kg, gern einen Satz weniger`};}
function pauseTipp(n,d,ps){ // fallen die Wiederholungen von Satz zu Satz stark ab, braucht die Übung mehr Pause
 const ds=Object.keys(S.sets||{}).filter(x=>x<d&&echteEinheit(x,n)&&!istDeload(x)).sort().slice(-2);if(ds.length<2)return null;
 const ab=ds.every(x=>{const st=(S.sets[x][n]||[]).filter(q=>(+q.reps||0)>0);if(st.length<3)return false;
  const kg=+st[0].kg||0;if(!st.every(q=>(+q.kg||0)==kg))return false;return (+st[st.length-1].reps)<=(+st[0].reps)*0.7;});
 if(!ab||ps>=240)return null;const neu=Math.min(300,ps+30);
 return {sek:neu,txt:`Deine Wiederholungen fallen von Satz zu Satz stark ab. Probier ${fmtPause(neu)} Pause statt ${fmtPause(ps)}.`};}
function pauseUeb(n,sek){S.restUeb=S.restUeb||{};S.restUeb[n]=sek;save();render();toast("Pause für diese Übung angepasst.");}
/* ---------- Steigerungsvorschlag: aus der letzten Einheit und dem Plan ---------- */
function zielWdh(pi){ // Wiederholungsbereich aus dem Plan
 const w=pi?pi.wieder:null;if(w==null)return null;
 if(typeof w=="number")return w>0?{lo:w,hi:w}:null;
 const t=String(w),m=t.match(/(\d+)\s*[–-]\s*(\d+)/);
 if(m)return {lo:+m[1],hi:+m[2]};
 const z=parseInt(t);return z?{lo:z,hi:z,rampe:/aufsteigend/.test(t)}:null;}
const kgTxt=v=>String(Math.round(v*100)/100).replace(".",",");
function kgSchritt(n,kg){const e=exById(n),bein=(e&&e.m=="Beine")||/kreuzheben/i.test(n);return kg<20?1:(bein&&kg>=60?5:2.5);}
function steigerung(n,d,pi){
 if(istDeload(d))return deloadVorschlag(n,d,pi);
 const v=steigerungNormal(n,d,pi),pl=plateau(n,d);
 if(!v||!pl)return v;
 if(pl.seit>=4&&v.kg!=null&&v.kg>=+(letzteSaetze(n,d).sets[0].kg||0)&&!/geschafft/.test(v.txt)){
  const kg=v.kg,neu=Math.max(kgSchritt(n,kg),Math.round(kg*0.9/2.5)*2.5);
  if(neu<kg){const z=zielWdh(pi);return {kg:neu,reps:z?z.lo:v.reps,txt:`Seit ${pl.seit} Einheiten kein neuer Bestwert → heute ${kgTxt(neu)} kg (90 %) und von dort wieder hocharbeiten`};}}
 v.plateau=pl;return v;}
function steigerungNormal(n,d,pi){
 const lz=letzteSaetze(n,d);if(!lz)return null;
 const art=uebArt(n),alle=lz.sets.filter(x=>(+x.reps||0)>0);if(!alle.length)return null;
 const top=Math.max(...alle.map(x=>+x.reps)),z=zielWdh(pi)||{lo:top,hi:top};
 const soll=pi&&pi.saetze>0?pi.saetze:alle.length,kg=Math.max(...alle.map(x=>+x.kg||0));
 const s=z.rampe?alle.filter(x=>(+x.kg||0)==kg):alle; // bei aufsteigenden Sätzen zählt der schwerste
 const wd=s.map(x=>+x.reps),mn=Math.min(...wd),mx=Math.max(...wd),brauch=z.rampe?1:soll;
 const ein=art=="zeit"?" s":" Wdh",war=(mn==mx?s.length+" × "+mn:wd.join(", "))+(art=="zeit"?" s":(mn==mx?"":" Wdh"));
 if(art=="zeit"||!kg){ // Haltezeit oder Körpergewicht: über Sekunden bzw. Wiederholungen steigern
  const voll=s.length>=brauch&&mn>=z.hi,plus=art=="zeit"?5:1,neu=voll?mn+plus:(mn<z.lo?z.lo:z.hi);
  return {reps:neu,txt:voll?`Letztes Mal ${war} geschafft → heute ${neu}${ein} je Satz${art=="koerper"?" oder mit Zusatzgewicht":""}`:`Letztes Mal ${war} → heute ${brauch} × ${neu}${ein} als Ziel`};}
 const gleich=s.every(x=>(+x.kg||0)==kg);
 if(s.length>=brauch&&gleich&&mn>=z.hi){const neu=kg+kgSchritt(n,kg);
  return {kg:neu,reps:z.lo,txt:`Letztes Mal ${war} mit ${kgTxt(kg)} kg geschafft → heute ${kgTxt(neu)} kg`};}
 if(gleich&&z.lo>3&&mx<z.lo-2){const neu=Math.max(2.5,Math.round(kg*0.9/2.5)*2.5);
  if(neu<kg)return {kg:neu,reps:z.lo,txt:`Letztes Mal nur ${war} mit ${kgTxt(kg)} kg → heute ${kgTxt(neu)} kg, bis ${z.lo} Wdh sauber gehen`};}
 return {kg,reps:z.hi,txt:`Letztes Mal ${gleich?war+" mit":"bis"} ${kgTxt(kg)} kg → heute gleiches Gewicht, Ziel ${brauch} × ${z.hi}`};}
function vsNehmen(d,n){const v=steigerung(n,d,planInfo(S.wk+"|"+S.day,n)),sets=(S.sets[d]&&S.sets[d][n])||[];if(!v||!sets.length)return;
 sets.forEach(x=>{if(x.u)return;if(v.kg!=null)x.kg=v.kg;x.reps=v.reps;x.vs=1;delete x.pf;});

function setOk(d,n,k,ps){const s=(S.sets[d]&&S.sets[d][n])||[],x=s[k];if(!x)return;
 if(x.ok){delete x.ok;if(x.au){delete x.u;delete x.au;}}else{x.ok=1;if(!x.u){x.u=1;x.au=1;}delete x.pf;}

function uebArt(n){const e=exById(n),s=((e&&e.s)||"").toLowerCase();

function sbTokSet(t){try{if(t)localStorage.setItem("gp_sb",JSON.stringify(t));else localStorage.removeItem("gp_sb");}catch(e){}}
async function sbReq(pfad,body,tok,methode){const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),20000),m=methode||"POST";
 try{return await fetch(SB_URL+pfad,{method:m,signal:ctl.signal,headers:{"apikey":SB_KEY,"Content-Type":"application/json",...(tok?{"Authorization":"Bearer "+tok}:{})},...(m=="GET"?{}:{body:JSON.stringify(body||{})})});}
 finally{clearTimeout(to);}}
function sbMerk(j,alt){const t={at:j.access_token,rt:j.refresh_token,exp:j.expires_at||(Date.now()/1000+(j.expires_in||3600)),uid:(j.user&&j.user.id)||(alt&&alt.uid)};sbTokSet(t);return t;}
async function sbAuth(neu){let t=sbTok();
 if(t&&!neu&&t.exp>Date.now()/1000+60)return t;
 if(t&&t.rt&&!neu){const r=await sbReq("/auth/v1/token?grant_type=refresh_token",{refresh_token:t.rt});
  if(r.ok)return sbMerk(await r.json(),t);
  if(r.status>=500||r.status==429)throw new Error("Server nicht erreichbar ("+r.status+")");
  if(["aktiv","passwort"].includes(konto().status)){konto().status="abgemeldet";save();throw new Error("abgemeldet");}
  logWarn("rangliste","Anmeldung abgelaufen, neues anonymes Konto",{status:r.status});}
 if(konto().status=="abgemeldet")throw new Error("abgemeldet");
 const r=await sbReq("/auth/v1/signup",{data:{}});
 if(!r.ok){const tx=await r.text().catch(()=>"");throw new Error("Anmeldung fehlgeschlagen ("+r.status+") "+tx.slice(0,120));}
 const j=await r.json();rl().neuKonto=!!t;return sbMerk(j);}
async function sbRpc(fn,args,wdh){const t=await sbAuth();
 const r=await sbReq("/rest/v1/rpc/"+fn,args||{},t.at);
 if(r.status==401&&!wdh){const x=sbTok();if(x){x.exp=0;sbTokSet(x);}return sbRpc(fn,args,true);}
 if(!r.ok){const tx=await r.text().catch(()=>"");throw new Error(fn+": "+r.status+" "+tx.slice(0,160));}
 return r.json();}
/* Warteschlange: Meldungen gehen raus, sobald Netz da ist */
function rlPush(fn,a){if(!rl().on)return;(rl().q=rl().q||[]).push({fn,a});if(rl().q.length>300)rl().q=rl().q.slice(-300);save();rlFlush();}
let rlLauf=null;
function rlFlush(){if(!rlLauf)rlLauf=rlSenden().finally(()=>{rlLauf=null;});return rlLauf;}
async function rlSenden(){const R=rl();if(!R.on||!(R.q||[]).length||(typeof navigator!="undefined"&&navigator.onLine===false))return;
 {while(R.q.length){const it=R.q[0];let j;
   try{j=await sbRpc(it.fn,it.a);}catch(e){logWarn("rangliste","Senden später",{fn:it.fn,fehler:e.message});break;}
   R.q.shift();save();
   if(j&&j.ok===false&&j.fehler)logWarn("rangliste",j.fehler,{fn:it.fn});
   if(j&&j.geprueft&&j.hinweis)toast(j.hinweis);
   if(it.fn=="gp_bestwert"&&j&&j.neu&&j.pts)toast("🏆 Neuer Bestwert: +"+j.pts+" Liga-Punkte");}}
}
/* Abgleich nach jedem Neuzeichnen: Trainingstage und Bestwerte der laufenden Woche */
function rlBesterSatz(d,n){let b=null;((S.sets[d]||{})[n]||[]).forEach(x=>{const kg=+x.kg||0,r=+x.reps||0;if(kg>0&&r>=1&&r<=20&&(x.ok||x.u)){const e=e1rm(kg,r);if(!b||e>b.e)b={kg,r,e};}});return b;}
function rlGewicht(){const w=S.weight||{},k=Object.keys(w).sort();return k.length?+w[k[k.length-1]]:null;}
let rlTimer=null;
function rlTick(){if(!rl().on||!rl().ready)return;clearTimeout(rlTimer);rlTimer=setTimeout(rlAbgleich,2500);}
function rlAbgleich(){const R=rl(),heute=todayISO(),mo=weekOf(0);if(!R.on||!R.ready)return;R.sent=R.sent||{};R.best=R.best||{};
 for(let i=0;i<7;i++){const d=tagMinus(mo,-i);if(d>heute)break;
  const n=Object.keys((S.sets||{})[d]||{}).filter(x=>echteEinheit(d,x)&&uebFertig(d,x)).length,komplett=trGeplant(d)&&trainiertAm(d);
  const sig=n+"|"+(komplett?1:0);
  if(R.sent[d]!==sig&&(n>0||R.sent[d]!=null)){R.sent[d]=sig;rlPush("gp_training",{p_day:d,p_ex:n,p_complete:komplett,p_streak:d==heute?trainSerie():0});}
  Object.keys((S.sets||{})[d]||{}).forEach(x=>{if(!echteEinheit(d,x))return;const b=rlBesterSatz(d,x);
   if(b&&b.e>(R.best[x]||0)+0.05){R.best[x]=b.e;rlPush("gp_bestwert",{p_ex:x,p_kg:b.kg,p_reps:b.r,p_bw:rlGewicht(),p_day:d});}});}
 Object.keys(R.sent).forEach(d=>{if(d<mo)delete R.sent[d];});save();}
function rlBasis(){ // beim Mitmachen: bisherige Bestwerte als Ausgangswert (bringen keine Punkte)
 const R=rl(),beste={};R.best={};
 Object.keys(S.sets||{}).forEach(d=>Object.keys(S.sets[d]||{}).forEach(n=>{if(!echteEinheit(d,n))return;const b=rlBesterSatz(d,n);if(b&&(!beste[n]||b.e>beste[n].e))beste[n]=b;}));
 Object.keys(beste).forEach(n=>{const b=beste[n];R.best[n]=b.e;R.q=(R.q||[]);R.q.push({fn:"gp_bestwert",a:{p_ex:n,p_kg:b.kg,p_reps:b.r,p_bw:rlGewicht(),p_day:todayISO()}});});}

async function rlSpeichern(){const nick=($("#rlNick").value||"").trim(),msg=$("#rlMsg"),btn=$("#rlGo");
 if(!$("#rlOk").checked){msg.textContent="Bitte bestätige die Einwilligung, sonst kann die Rangliste nicht funktionieren.";return;}
 if(!/^[A-Za-z0-9ÄÖÜäöüß_.-]{3,20}$/.test(nick)){msg.textContent="Erlaubt sind 3–20 Zeichen: Buchstaben, Zahlen, Punkt, Strich und Unterstrich.";return;}
 const sex=$("#rlSex").value,age=$("#rlAge").value,bw=$("#rlBw").checked;
 btn.disabled=true;btn.textContent="Wird gespeichert …";msg.textContent="";
 try{const j=await sbRpc("gp_profil_speichern",{p_nick:nick,p_avatar:RLF.av,p_sex:sex||null,p_age:age||null,p_bw:bw?rlGewicht():null});
  if(!j.ok){msg.textContent=j.fehler||"Das hat nicht geklappt.";btn.disabled=false;btn.textContent="Mitmachen";return;}
  const R=rl(),erst=!R.on;Object.assign(R,{on:true,ready:true,nick,avatar:RLF.av,sex,age,bw,seit:R.seit||todayISO()});
  if(erst){rlBasis();R.sent={};}save();logInfo("rangliste",erst?"Teilnahme gestartet":"Profil geändert");
  rlAbgleich();toast(erst?"Willkommen in der Rangliste!":"Profil gespeichert.");rlOpen("liga");}
 catch(e){logErr("rangliste","Profil speichern: "+e.message);msg.textContent=e.message=="abgemeldet"?"Du bist abgemeldet. Melde dich unter Mehr → Konto & Cloud neu an.":/Anonymous|anonymous_provider/i.test(e.message)?"Die Rangliste ist auf dem Server gerade nicht freigeschaltet.":"Keine Verbindung zum Server. Prüfe dein Internet und versuch es nochmal.";btn.disabled=false;btn.textContent="Mitmachen";}}

async function rlLaden(){const t=RLT.tab;await rlFlush();
 try{let h="";
  if(t=="liga"){const j=await sbRpc("gp_liga");if(!j.ok)return rlKeinProfil();rl().cache={liga:j.liga,anzahl:j.anzahl,ich:j.ich,zeit:Date.now()};save();h=rlLigaHtml(j);}
  else if(t=="kraft"){const ex=RLT.ex||Object.keys(rl().best||{})[0]||"";const j=await sbRpc("gp_kraft",{p_ex:ex});if(!j.ok)return rlKeinProfil();if(!RLT.ex&&j.uebungen&&j.uebungen.length&&!j.uebungen.includes(ex)){RLT.ex=j.uebungen[0];return rlLaden();}h=rlKraftHtml(j,ex);}

/* ---------- Konto und Cloud-Sicherung (freiwillig) ----------
   Ein Konto ist das anonyme Ranglisten-Konto plus bestätigter E-Mail und Passwort.
   Die Cloud-Sicherung legt die komplette App-Sicherung komprimiert auf dem Server ab. */
const SB_SITE="https://luggalugi-jpg.github.io/fitplan/essensplan.html";
const konto=()=>(S.konto=S.konto||{status:"keins"});   // keins | wartet | passwort | aktiv | abgemeldet
const mailOk=m=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(m||"");
function sbFehler(j,st){const c=(j&&(j.error_code||j.code))||"",m=(j&&(j.msg||j.error_description||j.message))||"";
 if(st==429||/rate_limit|rate limit/i.test(c+m))return "Gerade wurden zu viele E-Mails verschickt. Bitte versuch es in einer Stunde nochmal.";
 if(/email_exists|user_already_exists|already been registered/i.test(c+m))return "Für diese E-Mail gibt es schon ein Konto. Melde dich stattdessen an.";
 if(/weak_password|password should/i.test(c+m))return "Das Passwort ist zu schwach. Nimm mindestens 8 Zeichen.";
 if(/invalid_credentials|invalid login/i.test(c+m))return "E-Mail oder Passwort stimmt nicht.";
 if(/email_not_confirmed/i.test(c+m))return "Bitte bestätige zuerst deine E-Mail-Adresse über den Link in der E-Mail.";
 if(/email_address_invalid|invalid.*email|not authorized/i.test(c+m))return "An diese E-Mail-Adresse kann gerade nichts gesendet werden. Prüfe die Adresse oder versuch eine andere.";
 if(/same_password/i.test(c+m))return "Das neue Passwort muss sich vom alten unterscheiden.";
 return "Das hat nicht geklappt"+(m?": "+m:".");}
async function sbJson(r){try{return await r.json();}catch(e){return {};}}
function jwtSub(at){try{let b=at.split(".")[1].replace(/-/g,"+").replace(/_/g,"/");while(b.length%4)b+="=";return JSON.parse(atob(b)).sub;}catch(e){return null;}}
async function sbUser(){const t=await sbAuth(),r=await sbReq("/auth/v1/user",null,t.at,"GET");if(!r.ok)throw new Error("Nutzer "+r.status);return r.json();}
async function sbNeuToken(){const x=sbTok();if(x){x.exp=0;sbTokSet(x);}return sbAuth();}
async function kontoErstellen(){const em=($("#kMail").value||"").trim().toLowerCase(),msg=$("#kMsg"),btn=$("#kGo");
 if(!mailOk(em)){msg.textContent="Bitte gib eine gültige E-Mail-Adresse ein.";return;}
 if(!$("#kOk").checked){msg.textContent="Bitte bestätige die Einwilligung.";return;}
 btn.disabled=true;btn.textContent="Wird gesendet …";msg.textContent="";
 try{const t=await sbAuth(),r=await sbReq("/auth/v1/user?redirect_to="+encodeURIComponent(SB_SITE),{email:em},t.at,"PUT"),j=await sbJson(r);
  if(!r.ok){msg.textContent=sbFehler(j,r.status);logWarn("konto","Konto erstellen: "+(j.error_code||r.status));btn.disabled=false;btn.textContent="Bestätigungs-E-Mail senden";return;}
  const K=konto();Object.assign(K,{status:(j.email&&!j.is_anonymous)?"passwort":"wartet",email:em,cloud:$("#kCloud").checked,seit:Date.now()});save();

let cloudTimer=null,cloudLauf=false;
function cloudInhalt(){const d=Object.assign({},S);delete d.key;delete d.konto;return JSON.stringify({app:"GainPilot",version:PUBLIC_V,stand:new Date().toISOString(),daten:d});}
function hashStr(x){let h=5381;for(let i=0;i<x.length;i++)h=((h<<5)+h+x.charCodeAt(i))|0;return h>>>0;}
async function packen(str){if(typeof CompressionStream=="undefined"){return "j:"+btoa(unescape(encodeURIComponent(str)));}
 const buf=new Uint8Array(await new Response(new Blob([str]).stream().pipeThrough(new CompressionStream("gzip"))).arrayBuffer());
 let bin="";for(let i=0;i<buf.length;i+=0x8000)bin+=String.fromCharCode.apply(null,buf.subarray(i,i+0x8000));return "g:"+btoa(bin);}
async function entpacken(x){if(x.startsWith("j:"))return decodeURIComponent(escape(atob(x.slice(2))));
 const bin=atob(x.slice(2)),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
 return await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream("gzip"))).text();}
function cloudTick(){const K=S.konto;if(!K||K.status!="aktiv"||!K.cloud)return;clearTimeout(cloudTimer);
 const warte=Math.max(30000,(K.letzte||0)+5*60000-Date.now());cloudTimer=setTimeout(()=>cloudJetzt(false),warte);}
async function cloudJetzt(sofort,zeigen){const K=konto();if(K.status!="aktiv"||!K.cloud||cloudLauf)return;
 if(typeof navigator!="undefined"&&navigator.onLine===false)return;
 const roh=cloudInhalt(),hv=hashStr(roh.replace(/"stand":"[^"]*",/,""));
 if(!sofort&&K.hash===hv)return;
 cloudLauf=true;const b=document.getElementById("cJetzt");if(b&&zeigen){b.disabled=true;b.textContent="Wird gesichert …";}
 try{const data=await packen(roh),j=await sbRpc("gp_sicherung_speichern",{p_data:data,p_version:PUBLIC_V,p_geraet:(NATIV?"App":"Web")+" "+(navigator.platform||"").slice(0,30)});
  if(j&&j.ok){K.letzte=Date.now();K.hash=hv;save();logInfo("konto","Cloud-Sicherung gespeichert",{kb:Math.round(data.length/1024)});if(zeigen)toast("Gesichert ("+Math.max(1,Math.round(data.length/1024))+" KB).");}
  else{logWarn("konto","Cloud-Sicherung: "+((j&&j.fehler)||"?"));if(zeigen)toast((j&&j.fehler)||"Sichern hat nicht geklappt.");}}
 catch(e){logWarn("konto","Cloud-Sicherung später: "+e.message);if(zeigen)toast(e.message=="abgemeldet"?"Bitte melde dich neu an.":"Keine Verbindung zum Server.");}
 finally{cloudLauf=false;if(S.mtab=="konto"&&tab=="more"&&!document.querySelector(".modal"))render();}}
async function cloudLaden(ohneFrage){
 try{const j=await sbRpc("gp_sicherung_laden");
  if(!j.ok){toast(j.fehler||"Laden nicht möglich.");return;}
  if(!j.vorhanden){toast("Es gibt noch keine Cloud-Sicherung.");return;}
  if(!ohneFrage&&!confirm(`Sicherung vom ${new Date(j.zeit).toLocaleString("de-DE")} laden? Die Daten auf diesem Gerät werden ersetzt.`))return;
  const o=JSON.parse(await entpacken(j.data));sicherungAnwenden(o.daten||o);
  konto().hash=null;konto().letzte=Date.parse(j.zeit)||Date.now();save();logInfo("konto","Cloud-Sicherung geladen",{stand:o.stand});toast("Sicherung geladen.");render();}

 const heute=todayISO(),r={uebungen:0,komplett:0,pr:0,lauf:0,spiele:gS().xp||0,anzPr:0,anzUeb:0,anzKomplett:0,anzLauf:0};
 const tage=Object.keys(S.sets||{}).filter(d=>d<=heute).sort(),best={};
 tage.forEach(d=>{const st=S.sets[d]||{};
  Object.keys(st).forEach(n=>{if(!echteEinheit(d,n)||!uebFertig(d,n))return;r.anzUeb++;
   const b=Math.max(0,...(st[n]||[]).map(x=>e1rm(x.kg,x.reps)));
   if(b>0){if(best[n]>0&&b>best[n]+0.05)r.anzPr++;if(!(best[n]>=b))best[n]=b;}});
  if(trGeplant(d)&&trainiertAm(d))r.anzKomplett++;});
 rLogs().filter(x=>x.d<=heute).forEach(x=>{r.anzLauf++;r.lauf+=Math.min(Math.round((x.km||0)*2),40);});
 r.uebungen=r.anzUeb*XP_UEB;r.komplett=r.anzKomplett*XP_KOMPLETT;r.pr=r.anzPr*XP_PR;r.lauf+=r.anzLauf*XP_LAUF;
 r.total=r.uebungen+r.komplett+r.pr+r.lauf+r.spiele;return r;}
const lvSchritt=n=>150+50*(n-1);                       // XP von Level n zu n+1
const lvStart=L=>150*(L-1)+25*(L-1)*(L-2);             // XP, ab denen Level L erreicht ist
function gLevel(){const x=athXP().total;let lv=1;while(x>=lvStart(lv+1))lv++;
 const need=lvSchritt(lv);return {lv,xp:x,in:x-lvStart(lv),need,t:GTITEL[Math.min(Math.floor((lv-1)/2),GTITEL.length-1)]};}

function tageZw(a,b){return Math.round((dateOf(b,0)-dateOf(a,0))/864e5);}
// Mittelwert der Messungen der letzten 7 Tage bis einschließlich Tag k
function wTrend(ks,w,k){let s=0,n=0;ks.forEach(x=>{const d=tageZw(x,k);if(d>=0&&d<7){s+=+w[x];n++;}});return n?s/n:null;}
/* --- Allgemeine Verlaufskurve (Kraft und Laufen). pts: [{d:"JJJJ-MM-TT",v:Zahl}] --- */
function linChart(pts,o){
 const W=320,H=140,PL=42,PR=12,PT=12,PB=22;
 const vs=pts.map(p=>p.v);let lo=Math.min(...vs),hi=Math.max(...vs);
 const pad=Math.max(o.minPad||1,(hi-lo)*0.15);lo=Math.max(0,lo-pad);hi+=pad;
 const t=p=>new Date(p.d+"T12:00:00").getTime(),t0=t(pts[0]),t1=t(pts[pts.length-1]);
 const x=p=>PL+(W-PL-PR)*(t1>t0?(t(p)-t0)/(t1-t0):0.5);
 const y=v=>{const f=(v-lo)/(hi-lo);return PT+(H-PT-PB)*(o.inv?f:1-f);};
 const kurz=d=>(+d.slice(8,10))+"."+(+d.slice(5,7))+".";
 const grid=[0,0.5,1].map(f=>{const v=lo+(hi-lo)*f;return `<line x1="${PL}" y1="${y(v).toFixed(1)}" x2="${W-PR}" y2="${y(v).toFixed(1)}" stroke="var(--line)" stroke-width="1"/>
 <text x="${PL-5}" y="${(y(v)+3.5).toFixed(1)}" font-size="9" fill="var(--mut)" text-anchor="end">${o.fmt(v)}</text>`;}).join("");
 let bi=0;pts.forEach((p,i)=>{if(o.inv?p.v<pts[bi].v:p.v>pts[bi].v)bi=i;});
 const weg=pts.map((p,i)=>`${i?"L":"M"}${x(p).toFixed(1)} ${y(p.v).toFixed(1)}`).join(" ");
 const dots=pts.map((p,i)=>`<circle cx="${x(p).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="${i==bi?4.2:2.6}" fill="${i==bi?"var(--heat)":"var(--brand)"}" stroke="var(--card)" stroke-width="1.2"><title>${kurz(p.d)}: ${o.fmt(p.v)}</title></circle>`).join("");
 const xl=t1>t0?`<text x="${PL}" y="${H-6}" font-size="9" fill="var(--mut)">${kurz(pts[0].d)}</text><text x="${W-PR}" y="${H-6}" font-size="9" fill="var(--mut)" text-anchor="end">${kurz(pts[pts.length-1].d)}</text>`:"";
 return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;margin-top:8px" role="img" aria-label="${esc(o.aria||"Verlauf")}">
  ${grid}<path d="${weg}" fill="none" stroke="var(--brand)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>${dots}${xl}</svg>`;
}
function wChart(){
