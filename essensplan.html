<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16a34a">
<title>Fit-Wochenplan</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,sans-serif;background:#f3f4f6;color:#111;padding-bottom:70px}
header{background:#16a34a;color:#fff;padding:14px 16px;font-weight:700;font-size:18px;position:sticky;top:0;z-index:5}
main{padding:12px;max-width:600px;margin:auto}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid #ddd;z-index:5}
nav button{flex:1;padding:14px 0;border:0;background:none;font-size:15px;color:#555}
nav button.on{color:#16a34a;font-weight:700;border-top:3px solid #16a34a}
.days{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}
.days button{flex:1;min-width:46px;padding:10px 0;border-radius:10px;border:1px solid #ccc;background:#fff;font-size:14px}
.days button.on{background:#16a34a;color:#fff;border-color:#16a34a}
.card{background:#fff;border-radius:14px;padding:12px;margin-bottom:10px;box-shadow:0 1px 3px #0001}
.slot h4{margin:0 0 6px;font-size:13px;color:#666;text-transform:uppercase}
.pick{width:100%;padding:12px;border:2px dashed #bbb;border-radius:10px;background:none;color:#555;font-size:15px}
.meal{display:flex;justify-content:space-between;align-items:center;gap:8px}
.meal b{font-size:15px}.meal small{color:#666;display:block;margin-top:2px}
.x{border:0;background:#fee2e2;color:#b91c1c;border-radius:8px;padding:6px 10px;font-size:15px}
.step{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:14px}
.step button{width:32px;height:32px;border-radius:50%;border:1px solid #ccc;background:#fff;font-size:18px}
.bar{height:10px;background:#e5e7eb;border-radius:6px;overflow:hidden;margin:4px 0 10px}
.bar i{display:block;height:100%;background:#16a34a}
.bar i.over{background:#ef4444}
.row{display:flex;justify-content:space-between;font-size:14px}
.modal{position:fixed;inset:0;background:#0007;z-index:10;display:flex;align-items:flex-end}
.sheet{background:#fff;width:100%;max-height:80vh;overflow:auto;border-radius:18px 18px 0 0;padding:14px}
.opt{padding:12px;border-bottom:1px solid #eee}
.opt small{color:#666;display:block}
.chk{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #eee;font-size:16px}
.chk input{width:22px;height:22px}
.chk.done span{text-decoration:line-through;color:#999}
h3{margin:14px 0 4px}
input.n{width:100%;padding:10px;font-size:16px;border:1px solid #ccc;border-radius:8px;margin:4px 0 10px}
.btn{padding:12px;border:0;border-radius:10px;background:#16a34a;color:#fff;font-size:15px;margin:3px 3px 3px 0}
.btn.g{background:#6b7280}
</style>
</head>
<body>
<header id="title">Fit-Wochenplan</header>
<main id="app"></main>
<nav>
<button data-t="plan" class="on">📅 Plan</button>
<button data-t="shop">🛒 Einkauf</button>
<button data-t="goal">🎯 Ziele</button>
</nav>
<script>
const DAYS=["Mo","Di","Mi","Do","Fr","Sa","So"];
const SLOTS=[["f","Frühstück"],["m","Mittagessen"],["a","Abendessen"],["s","Snack"]];
// Nährwerte pro Portion (kcal, Eiweiß, Kohlenhydrate, Fett) – Richtwerte
const MEALS=[
{id:1,c:"f",n:"Haferflocken mit Magerquark & Beeren",k:430,p:38,h:58,f:5,i:[["Haferflocken",60,"g"],["Magerquark",250,"g"],["Beeren (TK)",100,"g"]]},
{id:2,c:"f",n:"Rührei (3 Eier) mit Vollkornbrot",k:435,p:26,h:37,f:18,i:[["Eier",3,"Stk"],["Vollkornbrot",80,"g"],["Tomaten",100,"g"]]},
{id:3,c:"f",n:"Skyr mit Banane & Walnüssen",k:400,p:36,h:40,f:11,i:[["Skyr",300,"g"],["Banane",1,"Stk"],["Walnüsse",15,"g"]]},
{id:4,c:"f",n:"Protein-Pancakes",k:530,p:33,h:72,f:14,i:[["Haferflocken",60,"g"],["Eier",2,"Stk"],["Banane",1,"Stk"],["Magerquark",100,"g"]]},
{id:5,c:"m",n:"Hähnchen mit Reis & Brokkoli",k:570,p:46,h:62,f:13,i:[["Hähnchenbrust",150,"g"],["Reis (roh)",70,"g"],["Brokkoli",200,"g"],["Olivenöl",1,"EL"]]},
{id:6,c:"m",n:"Thunfisch-Vollkornnudelsalat",k:520,p:43,h:59,f:14,i:[["Vollkornnudeln (roh)",70,"g"],["Thunfisch (Dose)",1,"Dose"],["Tomaten",150,"g"],["Gurke",100,"g"],["Olivenöl",1,"EL"]]},
{id:7,c:"m",n:"Rote-Linsen-Curry mit Spinat",k:400,p:24,h:58,f:8,i:[["Rote Linsen",80,"g"],["Kokosmilch light",100,"ml"],["Passierte Tomaten",150,"g"],["Spinat",100,"g"],["Zwiebeln",1,"Stk"]]},
{id:8,c:"m",n:"Rinderhack-Gemüsepfanne mit Kartoffeln",k:510,p:38,h:54,f:14,i:[["Rinderhack (mager)",150,"g"],["Kartoffeln",300,"g"],["Paprika",200,"g"],["Olivenöl",0.5,"EL"]]},
{id:9,c:"a",n:"Lachs mit Süßkartoffel & Brokkoli",k:595,p:40,h:56,f:20,i:[["Lachsfilet",150,"g"],["Süßkartoffeln",250,"g"],["Brokkoli",200,"g"]]},
{id:10,c:"a",n:"Hähnchen-Wok mit Gemüse",k:520,p:45,h:53,f:13,i:[["Hähnchenbrust",150,"g"],["Wokgemüse (TK)",300,"g"],["Reis (roh)",50,"g"],["Sojasauce",1,"EL"],["Olivenöl",1,"EL"]]},
{id:11,c:"a",n:"Gemüse-Omelett mit Hüttenkäse",k:500,p:42,h:27,f:22,i:[["Eier",3,"Stk"],["Hüttenkäse",150,"g"],["Paprika",150,"g"],["Vollkornbrot",40,"g"]]},
{id:12,c:"a",n:"Puten-Chili mit Reis",k:515,p:46,h:67,f:4,i:[["Putenhack",150,"g"],["Kidneybohnen (Dose)",100,"g"],["Passierte Tomaten",200,"g"],["Paprika",100,"g"],["Reis (roh)",50,"g"]]},
{id:13,c:"s",n:"Magerquark mit Beeren",k:210,p:31,h:18,f:1,i:[["Magerquark",250,"g"],["Beeren (TK)",100,"g"]]},
{id:14,c:"s",n:"Proteinshake mit Milch",k:255,p:34,h:16,f:7,i:[["Whey-Protein",30,"g"],["Milch 1,5%",300,"ml"]]},
{id:15,c:"s",n:"Apfel mit Mandeln",k:230,p:5,h:22,f:13,i:[["Apfel",1,"Stk"],["Mandeln",25,"g"]]},
{id:16,c:"s",n:"Hüttenkäse mit Gurke",k:200,p:23,h:8,f:8,i:[["Hüttenkäse",200,"g"],["Gurke",100,"g"]]},
{id:17,c:"s",n:"2 gekochte Eier mit Möhren",k:210,p:14,h:13,f:10,i:[["Eier",2,"Stk"],["Möhren",150,"g"]]}
];
const S=JSON.parse(localStorage.getItem("fitplan")||"null")||{plan:{},done:{},kcal:2000,prot:150,day:0};
const save=()=>localStorage.setItem("fitplan",JSON.stringify(S));
let tab="plan";
const $=s=>document.querySelector(s);
const meal=id=>MEALS.find(m=>m.id==id);
const r=x=>Math.round(x*10)/10;
function entries(d){return SLOTS.flatMap(([s])=>(S.plan[d+s]||[]).map(e=>({s,e,m:meal(e.id)})));}
function totals(d){const t={k:0,p:0,h:0,f:0};entries(d).forEach(({e,m})=>{["k","p","h","f"].forEach(x=>t[x]+=m[x]*e.q)});return t;}
function bar(l,v,max,u){const pc=Math.min(100,v/max*100);return `<div class="row"><span>${l}</span><span>${Math.round(v)} / ${max} ${u}</span></div><div class="bar"><i class="${v>max*1.05?'over':''}" style="width:${pc}%"></i></div>`;}
function render(){
 document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t==tab));
 $("#title").textContent={plan:"Wochenplan",shop:"Einkaufsliste",goal:"Ziele & Wochenübersicht"}[tab];
 $("#app").innerHTML={plan:viewPlan,shop:viewShop,goal:viewGoal}[tab]();
}
function viewPlan(){
 const d=S.day,t=totals(d);
 let h=`<div class="days">${DAYS.map((x,i)=>`<button class="${i==d?'on':''}" onclick="S.day=${i};save();render()">${x}</button>`).join("")}</div>`;
 h+=`<div class="card">${bar("Kalorien",t.k,S.kcal,"kcal")}${bar("Eiweiß",t.p,S.prot,"g")}<div class="row"><span>KH ${Math.round(t.h)} g</span><span>Fett ${Math.round(t.f)} g</span></div></div>`;
 SLOTS.forEach(([s,name])=>{
  const list=S.plan[d+s]||[];
  h+=`<div class="card slot"><h4>${name}</h4>`;
  list.forEach((e,i)=>{const m=meal(e.id);
   h+=`<div class="meal" style="margin-bottom:8px"><div><b>${m.n}</b><small>${Math.round(m.k*e.q)} kcal · ${Math.round(m.p*e.q)} g Eiweiß · ${Math.round(m.h*e.q)} g KH · ${Math.round(m.f*e.q)} g Fett</small>
   <div class="step"><button onclick="qty('${d+s}',${i},-0.5)">−</button>${e.q} Portion(en)<button onclick="qty('${d+s}',${i},0.5)">+</button></div></div>
   <button class="x" onclick="del('${d+s}',${i})">✕</button></div>`;});
  h+=`<button class="pick" onclick="choose(${d},'${s}')">+ Gericht wählen</button></div>`;
 });
 h+=`<button class="btn g" onclick="copyDay()">Tag auf alle Tage kopieren</button>`;
 return h;
}
function choose(d,s){
 const o=MEALS.filter(m=>m.c==s).map(m=>`<div class="opt" onclick="add('${d+s}',${m.id})"><b>${m.n}</b><small>${m.k} kcal · ${m.p} g Eiweiß · ${m.h} g KH · ${m.f} g Fett</small></div>`).join("");
 const all=MEALS.filter(m=>m.c!=s).map(m=>`<div class="opt" onclick="add('${d+s}',${m.id})">${m.n}<small>${m.k} kcal · ${m.p} g Eiweiß</small></div>`).join("");
 const el=document.createElement("div");el.className="modal";el.onclick=e=>{if(e.target==el)el.remove()};
 el.innerHTML=`<div class="sheet"><b>Vorschläge</b>${o}<h3>Weitere Gerichte</h3>${all}</div>`;
 document.body.appendChild(el);
}
function add(k,id){(S.plan[k]=S.plan[k]||[]).push({id,q:1});save();document.querySelector(".modal")?.remove();render();}
function del(k,i){S.plan[k].splice(i,1);save();render();}
function qty(k,i,dq){const e=S.plan[k][i];e.q=Math.max(0.5,e.q+dq);save();render();}
function copyDay(){if(!confirm("Plan des gewählten Tages auf alle anderen Tage kopieren?"))return;
 for(let d=0;d<7;d++){if(d==S.day)continue;SLOTS.forEach(([s])=>{S.plan[d+s]=JSON.parse(JSON.stringify(S.plan[S.day+s]||[]));});}save();render();}
function viewShop(){
 const agg={};
 for(let d=0;d<7;d++)entries(d).forEach(({e,m})=>m.i.forEach(([n,a,u])=>{const k=n+"|"+u;agg[k]=(agg[k]||0)+a*e.q;}));
 const keys=Object.keys(agg).sort((a,b)=>a.localeCompare(b,"de"));
 if(!keys.length)return `<div class="card">Noch keine Gerichte geplant. Wähle zuerst Gerichte im Plan.</div>`;
 let h=`<div class="card">`;
 keys.forEach(k=>{const [n,u]=k.split("|");let a=agg[k],unit=u;
  if(u=="g"&&a>=1000){a/=1000;unit="kg"}if(u=="ml"&&a>=1000){a/=1000;unit="l"}
  h+=`<label class="chk ${S.done[k]?'done':''}"><input type="checkbox" ${S.done[k]?'checked':''} onchange="S.done['${k.replace(/'/g,"\\'")}']=this.checked;save();render()"><span>${r(a)} ${unit} ${n}</span></label>`;});
 h+=`</div><button class="btn g" onclick="S.done={};save();render()">Haken zurücksetzen</button><button class="btn" onclick="shareList()">Liste teilen</button>`;
 return h;
}
function shareList(){
 const agg={};
 for(let d=0;d<7;d++)entries(d).forEach(({e,m})=>m.i.forEach(([n,a,u])=>{const k=n+" ("+u+")";agg[k]=(agg[k]||0)+a*e.q;}));
 const txt="Einkaufsliste:\n"+Object.entries(agg).map(([k,v])=>"- "+r(v)+" "+k).join("\n");
 navigator.share?navigator.share({text:txt}):(navigator.clipboard.writeText(txt),alert("In Zwischenablage kopiert"));
}
function viewGoal(){
 let h=`<div class="card"><b>Zielvorgaben pro Tag</b><br><br>
 <button class="btn" onclick="preset(1900,150)">Abnehmen</button><button class="btn" onclick="preset(2800,170)">Muskelaufbau</button>
 <label>Kalorien (kcal)</label><input class="n" type="number" value="${S.kcal}" onchange="S.kcal=+this.value;save()">
 <label>Eiweiß (g)</label><input class="n" type="number" value="${S.prot}" onchange="S.prot=+this.value;save()">
 <small>Die Voreinstellungen sind grobe Richtwerte. Dein Bedarf hängt von Gewicht, Größe, Alter und Aktivität ab. Als Faustregel gelten 1,6 bis 2,2 g Eiweiß pro kg Körpergewicht. Zum Abnehmen zieht man etwa 300 bis 500 kcal vom Bedarf ab, für Muskelaufbau gibt man etwa 200 bis 300 kcal dazu.</small></div>
 <div class="card"><b>Wochenübersicht</b><br><br>`;
 let sum={k:0,p:0},n=0;
 for(let d=0;d<7;d++){const t=totals(d);if(t.k){n++;sum.k+=t.k;sum.p+=t.p;}
  h+=`<div class="row"><b>${DAYS[d]}</b><span>${Math.round(t.k)} kcal · ${Math.round(t.p)} g Eiweiß</span></div>`;}
 if(n)h+=`<hr><div class="row"><b>Ø geplante Tage</b><span>${Math.round(sum.k/n)} kcal · ${Math.round(sum.p/n)} g Eiweiß</span></div>`;
 h+=`</div><button class="btn g" onclick="if(confirm('Gesamte Woche löschen?')){S.plan={};S.done={};save();render()}">Woche leeren</button>`;
 return h;
}
function preset(k,p){S.kcal=k;S.prot=p;save();render();}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
render();
</script>
</body>
</html>
